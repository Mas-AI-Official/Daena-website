<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daena AI - Investor Pitch Deck</title>
    <meta name="description" content="Daena AI Pitch Deck: Revolutionary SFHC technology with 48 AI agents delivering 300% ROI and 99.4% cost savings">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #FFD700;
            --secondary-cyan: #00bcd4;
            --dark-bg: #0f0f23;
            --darker-bg: #1a1a3a;
            --accent-purple: #2a1a4a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #FFD700 0%, #00bcd4 100%);
            --gradient-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2a1a4a 100%);
            --shadow-glow: 0 0 30px rgba(255, 215, 0, 0.3);
            --shadow-strong: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #02030a;
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* Cover whole site with consistent background - unified black glassy universe */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at top, rgba(255, 215, 0, 0.12) 0%, transparent 55%),
                radial-gradient(circle at bottom, rgba(0, 188, 212, 0.08) 0%, transparent 60%),
                #02030a;
            z-index: -5;
            pointer-events: none;
        }

        /* Metatron's Cube Background - unified continuous background */
        .metatron-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: 
                radial-gradient(ellipse at center, rgba(255, 215, 0, 0.1) 0%, transparent 70%),
                linear-gradient(135deg, rgba(15, 15, 35, 0.95) 0%, rgba(26, 26, 58, 0.95) 50%, rgba(42, 26, 74, 0.95) 100%);
            opacity: 0.3;
            pointer-events: none;
        }

        /* Metatron's Cube Pattern Background Image */
        .metatron-pattern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.3;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="200" cy="200" r="40" fill="none" stroke="%23FFD700" stroke-width="2" opacity="0.3"/><circle cx="200" cy="120" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><circle cx="280" cy="160" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><circle cx="280" cy="240" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><circle cx="200" cy="280" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><circle cx="120" cy="240" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><circle cx="120" cy="160" r="30" fill="none" stroke="%23FFD700" stroke-width="1.5" opacity="0.25"/><line x1="200" y1="200" x2="200" y2="120" stroke="%23FFD700" stroke-width="1" opacity="0.2"/><line x1="200" y1="200" x2="280" y2="160" stroke="%23FFD700" stroke-width="1" opacity="0.2"/><line x1="200" y1="200" x2="280" y2="240" stroke="%23FFD700" stroke-width="1" opacity="0.2"/><line x1="200" y1="200" x2="200" y2="280" stroke="%23FFD700" stroke-width="1" opacity="0.2"/><line x1="200" y1="200" x2="120" y2="240" stroke="%23FFD700" stroke-width="1" opacity="0.2"/><line x1="200" y1="200" x2="120" y2="160" stroke="%23FFD700" stroke-width="1" opacity="0.2"/></svg>');
            background-size: 600px 600px;
            background-position: center;
            background-repeat: repeat;
            pointer-events: none;
            animation: metatronRotate 60s linear infinite;
        }

        @keyframes metatronRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Hexagonal Node Network Canvas */
        #metatron-hex-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            z-index: 1000;
            padding: 1rem 2rem;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .back-button {
            background: var(--gradient-primary);
            color: var(--dark-bg);
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-glow);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        /* Presentation Container */
        .presentation-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            padding-top: 80px;
        }
        
        /* Fullscreen styles - using body for fullscreen so controls stay visible */
        body:fullscreen .presentation-container,
        body:-webkit-full-screen .presentation-container,
        body:-moz-full-screen .presentation-container,
        body:-ms-fullscreen .presentation-container {
            width: 100vw;
            height: 100vh;
            padding-top: 0;
            padding-bottom: 120px;
            background: #02030a;
        }
        
        body:fullscreen .slide-container,
        body:-webkit-full-screen .slide-container,
        body:-moz-full-screen .slide-container,
        body:-ms-fullscreen .slide-container {
            padding: 20px 20px 140px 20px;
        }
        
        body:fullscreen .slide img,
        body:-webkit-full-screen .slide img,
        body:-moz-full-screen .slide img,
        body:-ms-fullscreen .slide img {
            width: 90%;
            height: 70%;
        }
        
        /* Mobile fullscreen adjustments */
        @media (max-width: 768px) {
            body:fullscreen .slide img,
            body:-webkit-full-screen .slide img {
                width: 100%;
                height: auto;
                max-height: calc(100vh - 200px);
            }
            
            body:fullscreen .presentation-container,
            body:-webkit-full-screen .presentation-container {
                padding-bottom: 180px;
            }
            
            body:fullscreen .slide-container,
            body:-webkit-full-screen .slide-container {
                padding: 10px 10px 140px 10px;
            }
        }
        
        /* Hide Metatron background in fullscreen */
        body:fullscreen .metatron-bg,
        body:-webkit-full-screen .metatron-bg,
        body:-moz-full-screen .metatron-bg,
        body:-ms-fullscreen .metatron-bg,
        body:fullscreen .metatron-pattern-bg,
        body:-webkit-full-screen .metatron-pattern-bg,
        body:-moz-full-screen .metatron-pattern-bg,
        body:-ms-fullscreen .metatron-pattern-bg,
        body:fullscreen #metatron-hex-canvas,
        body:-webkit-full-screen #metatron-hex-canvas,
        body:-moz-full-screen #metatron-hex-canvas,
        body:-ms-fullscreen #metatron-hex-canvas {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        
        /* Keep controls visible in fullscreen */
        body:fullscreen .audio-controls,
        body:-webkit-full-screen .audio-controls,
        body:-moz-full-screen .audio-controls,
        body:-ms-fullscreen .audio-controls {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            z-index: 10000 !important;
            position: fixed !important;
            bottom: 30px !important;
        }
        
        /* Also keep navbar visible in fullscreen */
        body:fullscreen .navbar,
        body:-webkit-full-screen .navbar,
        body:-moz-full-screen .navbar,
        body:-ms-fullscreen .navbar {
            display: block !important;
            visibility: visible !important;
            z-index: 10001 !important;
            position: fixed !important;
        }

        .slide-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }

        .slide img {
            width: 85%;
            height: 60%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: var(--shadow-strong);
            margin-top: -80px;
        }

        .slide-number {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--secondary-cyan);
            font-size: 1rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 100;
            border: 2px solid rgba(0, 188, 212, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Enhanced Audio Controls */
        .audio-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(26, 26, 58, 0.9) 100%);
            padding: 20px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 188, 212, 0.3);
            box-shadow: var(--shadow-strong);
        }

        .audio-controls button {
            background: var(--gradient-primary);
            color: var(--dark-bg);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #fullscreenBtn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(0, 188, 212, 0.3)) !important;
            color: var(--primary-gold) !important;
            border: 2px solid rgba(255, 215, 0, 0.5) !important;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3) !important;
        }
        
        #fullscreenBtn:hover {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.5), rgba(0, 188, 212, 0.5)) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5) !important;
        }

        .audio-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .audio-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .audio-controls button.active {
            background: var(--secondary-cyan);
            color: var(--text-light);
        }

        .audio-controls button.loading {
            background: var(--text-muted);
            color: var(--text-light);
            cursor: not-allowed;
        }

        /* Speed Control */
        .speed-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .speed-controls label {
            font-size: 14px;
            color: var(--text-muted);
            margin-right: 5px;
        }

        .speed-controls select {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-light);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 14px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            width: 0%;
            transition: width 0.1s ease;
        }

        .slide-counter {
            color: var(--secondary-cyan);
            font-weight: bold;
            min-width: 80px;
            text-align: center;
            font-size: 16px;
        }

        .time-display {
            color: var(--text-muted);
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        /* Loading and Error States */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--secondary-cyan);
            z-index: 2000;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: var(--text-light);
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 2000;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem 1rem;
                height: auto;
                min-height: 50px;
            }
            
            .logo {
                font-size: 1.2rem;
            }
            
            .back-button {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .presentation-container {
                padding-top: 50px;
                padding-bottom: 180px; /* Space for controls */
            }
            
            .slide-container {
                padding: 10px;
            }
            
            .slide img {
                width: 100%;
                height: auto;
                max-height: calc(100vh - 250px); /* Account for navbar and controls */
                margin-top: 0;
            }
            
            .audio-controls {
                bottom: 5px;
                left: 5px;
                right: 5px;
                transform: none;
                padding: 8px 10px;
                flex-wrap: wrap;
                gap: 6px;
                border-radius: 15px;
                max-width: calc(100vw - 10px);
            }
            
            .audio-controls button {
                padding: 8px 12px;
                font-size: 12px;
                border-radius: 15px;
                flex: 1 1 auto;
                min-width: 60px;
            }
            
            #fullscreenBtn {
                font-size: 12px;
                padding: 8px 12px;
            }
            
            .progress-container {
                width: 100%;
                order: 10; /* Move to bottom */
                margin-top: 5px;
            }
            
            .progress-bar {
                width: 100%;
                max-width: none;
            }
            
            .slide-counter, .time-display {
                font-size: 11px;
                min-width: auto;
            }

            .speed-controls {
                padding: 4px 8px;
                font-size: 11px;
            }
            
            .speed-controls label {
                font-size: 11px;
                margin-right: 3px;
            }
            
            .speed-controls select {
                padding: 4px 8px;
                font-size: 11px;
            }
            
            #downloadBtn {
                padding: 8px 12px !important;
                font-size: 12px !important;
            }
        }
        
        /* Extra small mobile */
        @media (max-width: 480px) {
            .navbar {
                padding: 0.4rem 0.8rem;
                min-height: 45px;
            }
            
            .logo {
                font-size: 1rem;
            }
            
            .back-button {
                padding: 5px 10px;
                font-size: 11px;
            }
            
            .presentation-container {
                padding-top: 45px;
                padding-bottom: 200px;
            }
            
            .slide img {
                max-height: calc(100vh - 280px);
            }
            
            .audio-controls {
                padding: 6px 8px;
                gap: 4px;
                bottom: 2px;
                left: 2px;
                right: 2px;
            }
            
            .audio-controls button {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 50px;
            }
            
            .slide-counter, .time-display {
                font-size: 10px;
            }
        }

        /* Jazz Background Music Indicator */
        .music-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .music-indicator.playing {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--primary-gold);
        }

        /* Enhanced Slide Transitions */
        .slide-enter {
            animation: slideInRight 0.6s ease-out;
        }

        .slide-exit {
            animation: slideOutLeft 0.6s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutLeft {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-100%);
            }
        }
    </style>
</head>

            </div>
            <div class="slide-counter" id="slideCounter">1/13</div>
            <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        class EnhancedPresentationController {
            constructor() {
                this.slides = document.querySelectorAll('.slide');
                this.totalSlides = this.slides.length;
                this.currentSlide = 0;
                this.isPlaying = false;
                this.audioPlayer = document.getElementById('audioPlayer');
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.progressFill = document.getElementById('progressFill');
                this.slideCounter = document.getElementById('slideCounter');
                this.timeDisplay = document.getElementById('timeDisplay');
                this.speedSelect = document.getElementById('speedSelect');
                this.progressBar = document.getElementById('progressBar');
                this.loading = document.getElementById('loading');
                this.presentation = document.getElementById('presentation');
                this.errorMessage = document.getElementById('errorMessage');
                this.musicIndicator = document.getElementById('musicIndicator');
                this.loadedAudioIndex = null;
                this.pendingPlayHandler = null;
                this.isLoadingAudio = false;

                // Audio files for each slide
                this.audioFiles = [
                    'audio/slide-1.mp3',
                    'audio/slide-2.mp3',
                    'audio/slide-3.mp3',
                    'audio/slide-4.mp3',
                    'audio/slide-5.mp3',
                    'audio/slide-6.mp3',
                    'audio/slide-7.mp3',
                    'audio/slide-8.mp3',
                    'audio/slide-9.mp3',
                    'audio/slide-10.mp3',
                    'audio/slide-11.mp3',
                    'audio/slide-12.mp3',
                    'audio/slide-13.mp3'
                ];

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.showSlide(0);
                this.hideLoading();
            }

            setupEventListeners() {
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                this.prevBtn.addEventListener('click', () => this.previousSlide());
                this.nextBtn.addEventListener('click', () => this.nextSlide());
                this.speedSelect.addEventListener('change', () => this.changeSpeed());
                this.progressBar.addEventListener('click', (e) => this.seekTo(e));

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case ' ':
                            e.preventDefault();
                            this.togglePlayPause();
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.previousSlide();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextSlide();
                            break;
                        case 'Escape':
                            e.preventDefault();
                            this.stop();
                            break;
                    }
                });

                // Audio events
                this.audioPlayer.addEventListener('timeupdate', () => this.updateProgress());
                this.audioPlayer.addEventListener('ended', () => this.onAudioEnd());
                this.audioPlayer.addEventListener('error', () => this.onAudioError());
                this.audioPlayer.addEventListener('loadedmetadata', () => this.updateTimeDisplay());
            }

            showSlide(slideIndex) {
                // Remove active class from all slides
                this.slides.forEach(slide => {
                    slide.classList.remove('active');
                });
                
                // Add active class to current slide
                if (this.slides[slideIndex]) {
                    this.slides[slideIndex].classList.add('active');
                }
                
                this.currentSlide = slideIndex;
                this.updateSlideCounter();
            }

            loadAudioForSlide(slideIndex, forceReload = false) {
                const audioSrc = this.audioFiles[slideIndex];
                if (!audioSrc) {
                    return false;
                }

                if (!forceReload && this.loadedAudioIndex === slideIndex) {
                    return false;
                }

                this.cancelPendingPlayback();
                this.audioPlayer.pause();
                this.audioPlayer.currentTime = 0;
                this.audioPlayer.src = audioSrc;
                this.audioPlayer.load();
                this.progressFill.style.width = '0%';
                this.loadedAudioIndex = slideIndex;
                return true;
            }

            setPlayButtonState(state) {
                if (!this.playPauseBtn) return;
                switch(state) {
                    case 'loading':
                        this.isLoadingAudio = true;
                        this.playPauseBtn.textContent = '⏳ Loading...';
                        this.playPauseBtn.classList.add('loading');
                        this.playPauseBtn.classList.remove('active');
                        break;
                    case 'playing':
                        this.isLoadingAudio = false;
                        this.playPauseBtn.textContent = '⏸ Pause';
                        this.playPauseBtn.classList.add('active');
                        this.playPauseBtn.classList.remove('loading');
                        break;
                    default:
                        this.isLoadingAudio = false;
                        this.playPauseBtn.textContent = '▶ Play';
                        this.playPauseBtn.classList.remove('active', 'loading');
                        break;
                }
            }

            startPlayback(waitForLoad = false) {
                const attemptPlay = () => {
                    this.audioPlayer.play().then(() => {
                        this.isPlaying = true;
                        this.setPlayButtonState('playing');
                    }).catch(e => {
                        console.log('Auto-play failed:', e);
                        this.isPlaying = false;
                        this.setPlayButtonState('paused');
                    });
                };

                if (waitForLoad) {
                    this.cancelPendingPlayback();
                    this.pendingPlayHandler = () => {
                        this.pendingPlayHandler = null;
                        attemptPlay();
                    };
                    this.audioPlayer.addEventListener('canplaythrough', this.pendingPlayHandler, { once: true });
                } else {
                    attemptPlay();
                }
            }

            cancelPendingPlayback() {
                if (this.pendingPlayHandler) {
                    this.audioPlayer.removeEventListener('canplaythrough', this.pendingPlayHandler);
                    this.pendingPlayHandler = null;
                }
                this.isLoadingAudio = false;
            }

            togglePlayPause() {
                if (this.isPlaying) {
                    this.audioPlayer.pause();
                    this.isPlaying = false;
                    this.setPlayButtonState('paused');
                    return;
                }

                if (this.isLoadingAudio) {
                    this.cancelPendingPlayback();
                    this.setPlayButtonState('paused');
                    return;
                }

                const needsReload = this.loadedAudioIndex !== this.currentSlide;
                const reloaded = this.loadAudioForSlide(this.currentSlide, needsReload);
                if (reloaded || this.audioPlayer.readyState < 3) {
                    this.setPlayButtonState('loading');
                }

                const shouldWait = reloaded || this.audioPlayer.readyState < 3;
                this.startPlayback(shouldWait);
            }

            nextSlide() {
                if (this.currentSlide < this.totalSlides - 1) {
                    this.audioPlayer.pause();
                    this.showSlide(this.currentSlide + 1);
                    
                    const reloaded = this.loadAudioForSlide(this.currentSlide, true);
                    if (this.isPlaying) {
                        this.setPlayButtonState('loading');
                        const shouldWait = reloaded || this.audioPlayer.readyState < 3;
                        this.startPlayback(shouldWait);
                    } else {
                        this.setPlayButtonState('paused');
                    }
                }
            }

            previousSlide() {
                if (this.currentSlide > 0) {
                    this.audioPlayer.pause();
                    this.showSlide(this.currentSlide - 1);
                    
                    const reloaded = this.loadAudioForSlide(this.currentSlide, true);
                    if (this.isPlaying) {
                        this.setPlayButtonState('loading');
                        const shouldWait = reloaded || this.audioPlayer.readyState < 3;
                        this.startPlayback(shouldWait);
                    } else {
                        this.setPlayButtonState('paused');
                    }
                }
            }

            changeSpeed() {
                const speed = parseFloat(this.speedSelect.value);
                this.audioPlayer.playbackRate = speed;
            }

            seekTo(event) {
                if (!this.audioPlayer.duration) return;
                
                const rect = this.progressBar.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const percentage = clickX / rect.width;
                const newTime = percentage * this.audioPlayer.duration;
                
                this.audioPlayer.currentTime = newTime;
            }

            updateProgress() {
                if (this.audioPlayer.duration) {
                    const progress = (this.audioPlayer.currentTime / this.audioPlayer.duration) * 100;
                    this.progressFill.style.width = progress + '%';
                    this.updateTimeDisplay();
                }
            }

            updateTimeDisplay() {
                if (this.audioPlayer.duration) {
                    const current = this.formatTime(this.audioPlayer.currentTime);
                    const total = this.formatTime(this.audioPlayer.duration);
                    this.timeDisplay.textContent = `${current} / ${total}`;
                }
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            updateSlideCounter() {
                this.slideCounter.textContent = `${this.currentSlide + 1}/${this.totalSlides}`;
            }

            onAudioEnd() {
                // Reset progress bar
                this.progressFill.style.width = '0%';
                
                setTimeout(() => {
                    if (this.isPlaying && this.currentSlide < this.totalSlides - 1) {
                        this.nextSlide();
                    } else if (this.isPlaying) {
                        // End of presentation
                        this.isPlaying = false;
                        this.setPlayButtonState('paused');
                        this.audioPlayer.currentTime = 0;
                    }
                }, 1000); // Reduced delay for smoother transitions
            }

            onAudioError() {
                console.log('Audio loading failed for slide', this.currentSlide + 1);
                // Continue to next slide even if audio fails
                if (this.isPlaying) {
                    setTimeout(() => {
                        if (this.currentSlide < this.totalSlides - 1) {
                            this.nextSlide();
                        }
                    }, 3000);
                }
            }

            stop() {
                this.cancelPendingPlayback();
                this.audioPlayer.pause();
                this.isPlaying = false;
                this.setPlayButtonState('paused');
            }

            hideLoading() {
                setTimeout(() => {
                    this.loading.style.display = 'none';
                    this.presentation.style.display = 'flex';
                }, 2000);
            }
        }

        // Initialize presentation when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new EnhancedPresentationController();
            
            // Fullscreen functionality
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const presentation = document.getElementById('presentation');
            
            function toggleFullscreen() {
                const elem = document.documentElement; // Use documentElement for better mobile support
                const audioControls = document.querySelector('.audio-controls');
                const navbar = document.querySelector('.navbar');
                
                // Check if already in fullscreen
                const isFullscreen = document.fullscreenElement || 
                                    document.webkitFullscreenElement || 
                                    document.mozFullScreenElement || 
                                    document.msFullscreenElement ||
                                    (document.webkitCurrentFullScreenElement !== null);
                
                if (!isFullscreen) {
                    // Enter fullscreen - try multiple methods for cross-browser/mobile support
                    const enterFullscreen = () => {
                        if (elem.requestFullscreen) {
                            return elem.requestFullscreen();
                        } else if (elem.webkitRequestFullscreen) {
                            return elem.webkitRequestFullscreen();
                        } else if (elem.webkitEnterFullscreen) { // iOS Safari
                            return elem.webkitEnterFullscreen();
                        } else if (elem.mozRequestFullScreen) {
                            return elem.mozRequestFullScreen();
                        } else if (elem.msRequestFullscreen) {
                            return elem.msRequestFullscreen();
                        } else if (elem.requestFullscreen) {
                            return elem.requestFullscreen();
                        }
                        return Promise.reject('Fullscreen not supported');
                    };
                    
                    enterFullscreen().then(() => {
                        fullscreenBtn.innerHTML = '⛶ Exit Fullscreen';
                        
                        // Ensure controls stay visible
                        if (audioControls) {
                            audioControls.style.display = 'flex';
                            audioControls.style.visibility = 'visible';
                            audioControls.style.opacity = '1';
                            audioControls.style.zIndex = '10000';
                        }
                        if (navbar) {
                            navbar.style.display = 'block';
                            navbar.style.visibility = 'visible';
                            navbar.style.zIndex = '10001';
                        }
                    }).catch(err => {
                        console.log('Fullscreen error:', err);
                        // Fallback: try to maximize viewport on mobile
                        if (window.innerHeight === screen.height) {
                            fullscreenBtn.innerHTML = '⛶ Exit Fullscreen';
                        }
                    });
                } else {
                    // Exit fullscreen
                    const exitFullscreen = () => {
                        if (document.exitFullscreen) {
                            return document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            return document.webkitExitFullscreen();
                        } else if (document.webkitCancelFullScreen) {
                            return document.webkitCancelFullScreen();
                        } else if (document.mozCancelFullScreen) {
                            return document.mozCancelFullScreen();
                        } else if (document.msExitFullscreen) {
                            return document.msExitFullscreen();
                        }
                        return Promise.reject('Exit fullscreen not supported');
                    };
                    
                    exitFullscreen().then(() => {
                        fullscreenBtn.innerHTML = '⛶ Fullscreen';
                    }).catch(err => {
                        console.log('Exit fullscreen error:', err);
                        fullscreenBtn.innerHTML = '⛶ Fullscreen';
                    });
                }
            }
            
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
            
            // Update button text when fullscreen changes
            function updateFullscreenButton() {
                if (fullscreenBtn) {
                    if (document.fullscreenElement || document.webkitFullscreenElement || 
                        document.mozFullScreenElement || document.msFullscreenElement) {
                        fullscreenBtn.innerHTML = '⛶ Exit Fullscreen';
                        
                        // Ensure controls stay visible
                        const audioControls = document.querySelector('.audio-controls');
                        const navbar = document.querySelector('.navbar');
                        if (audioControls) {
                            audioControls.style.display = 'flex';
                            audioControls.style.visibility = 'visible';
                            audioControls.style.opacity = '1';
                            audioControls.style.zIndex = '10000';
                        }
                        if (navbar) {
                            navbar.style.display = 'block';
                            navbar.style.visibility = 'visible';
                            navbar.style.zIndex = '10001';
                        }
                    } else {
                        fullscreenBtn.innerHTML = '⛶ Fullscreen';
                    }
                }
            }
            
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
            document.addEventListener('mozfullscreenchange', updateFullscreenButton);
            document.addEventListener('MSFullscreenChange', updateFullscreenButton);
        });
    </script>

    <script src="metatron-hex-network.js"></script>
</body>
