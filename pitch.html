<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Live Pitch Deck | Daena AI | MAS-AI</title>
    <meta name="description" content="Daena AI Pitch Deck with live PowerPoint animations. View, download PDF, or listen to voice-overs per slide.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .pitch-container {
            min-height: 100vh;
            padding: 2rem;
            padding-top: 6rem;
            padding-bottom: 10rem;
        }
        
        .slide-container {
            width: 100%;
            height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .slide-viewer {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0.5rem;
        }
        
        .download-section {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #FFD700;
        }
        
        .btn-primary:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.7);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* Control Bar Styles */
        .control-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 2rem;
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        
        .control-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
            color: #FFD700;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .control-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            color: #FFD700;
        }
        
        .slide-counter {
            color: white;
            font-size: 0.875rem;
            min-width: 100px;
            text-align: center;
            padding: 0 1rem;
        }
        
        .audio-progress {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .audio-progress-bar {
            height: 100%;
            background: #FFD700;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .voice-list {
            margin-top: 3rem;
        }
        
        .voice-list details {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .voice-list summary {
            cursor: pointer;
            font-size: 1.125rem;
            font-weight: 600;
            color: #FFD700;
            padding: 0.5rem;
            user-select: none;
        }
        
        .voice-list summary:hover {
            color: #FFED4E;
        }
        
        .voice-list ul {
            margin-top: 1rem;
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .voice-list li {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .voice-list li span {
            min-width: 80px;
            font-weight: 500;
            color: #e5e7eb;
        }
        
        .voice-list audio {
            flex: 1;
            max-width: 100%;
        }
        
        @media (max-width: 768px) {
            .slide-container {
                height: 500px;
            }
            
            .pitch-container {
                padding: 1rem;
                padding-top: 5rem;
                padding-bottom: 8rem;
            }
            
            .voice-list li {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .voice-list li span {
                min-width: auto;
            }
            
            .voice-list audio {
                width: 100%;
            }
            
            .control-bar {
                bottom: 1rem;
                padding: 0.75rem 1rem;
                gap: 0.5rem;
                flex-wrap: wrap;
                max-width: calc(100% - 2rem);
                left: 1rem;
                right: 1rem;
                transform: none;
            }
            
            .control-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.75rem;
                flex: 1 1 auto;
                min-width: auto;
            }
            
            .slide-counter {
                font-size: 0.7rem;
                min-width: 60px;
                padding: 0 0.5rem;
            }
            
            .audio-progress {
                width: 100px;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-[100]" role="navigation" aria-label="Main navigation"
        style="pointer-events: none;">
        <div class="max-w-7xl mx-auto px-4 pt-4" style="pointer-events: auto;">
            <div class="glass-card flex items-center justify-between p-4" style="position: relative; z-index: 100;">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <section class="pitch-container container mx-auto">
        <h1 class="text-3xl font-semibold mb-6 text-center">Live Pitch Deck</h1>
        <p class="text-center text-gray-300 mb-6">View the interactive presentation with synchronized voice-over narration</p>
        
        <!-- Slide Viewer -->
        <div class="slide-container">
            <iframe
                id="slide-viewer"
                class="slide-viewer"
                title="Daena Pitch Deck"
                src=""
                frameborder="0"
                allowfullscreen
            ></iframe>
        </div>
        
        <!-- Control Bar -->
        <div class="control-bar" id="control-bar">
            <button class="control-btn" id="prev-btn" aria-label="Previous slide">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Prev
            </button>
            <button class="control-btn active" id="play-pause-btn" aria-label="Play/Pause">
                <svg class="w-5 h-5" id="play-icon" fill="currentColor" viewBox="0 0 20 20" style="display: none;">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
                <svg class="w-5 h-5" id="pause-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span id="play-pause-text">Pause</span>
            </button>
            <div class="audio-progress" id="audio-progress">
                <div class="audio-progress-bar" id="audio-progress-bar"></div>
            </div>
            <button class="control-btn" id="mute-btn" aria-label="Mute" title="Mute/Unmute">
                <svg class="w-5 h-5" id="mute-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"/>
                </svg>
                <svg class="w-5 h-5" id="unmute-icon" fill="currentColor" viewBox="0 0 20 20" style="display: none;">
                    <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"/>
                    <path d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06L3.28 2.22z"/>
                </svg>
                <span id="mute-text">Mute</span>
            </button>
            <button class="control-btn" id="speed-btn" aria-label="Playback Speed" title="Playback Speed">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
                <span id="speed-text">1×</span>
            </button>
            <span class="slide-counter" id="slide-counter">Slide 1 / 14</span>
            <button class="control-btn" id="next-btn" aria-label="Next slide">
                Next
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
            <button class="control-btn" id="download-btn" aria-label="Download" title="Download presentation">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </button>
            <button class="control-btn" id="fullscreen-btn" aria-label="Fullscreen" title="Fullscreen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>
        </div>
        
        <!-- Download Section -->
        <div class="download-section">
            <a class="btn btn-primary" href="/assets/pitch/daena_pitch_deck.pdf" download>
                📥 Download PDF
            </a>
            <a class="btn btn-secondary" href="/assets/pitch/daena_pitch_deck.pptx" download>
                📥 Download PPTX
            </a>
        </div>
        
        <!-- Voice Over List -->
        <div class="voice-list">
            <details>
                <summary>Voice overs (per slide)</summary>
                <ul id="voice-list"></ul>
            </details>
        </div>
    </section>
    
    <script>
        // Presentation state
        let currentSlide = 1;
        const totalSlides = 14;
        let audio = null;
        let isPlaying = false;
        let isMuted = false;
        let currentSpeed = 1;
        const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
        let autoAdvance = true;
        
        // Get the current origin
        const origin = window.location.origin;
        const pptUrl = `${origin}/assets/pitch/daena_pitch_deck.pptx`;
        
        // Office Web Viewer URL
        function getSlideUrl(slideNum = 1) {
            // Office Web Viewer doesn't support direct slide navigation, but we'll track it
            return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(pptUrl)}`;
        }
        
        // Initialize slide viewer
        const slideViewer = document.getElementById('slide-viewer');
        slideViewer.src = getSlideUrl(1);
        
        // Load voice-over for a specific slide
        function loadAudioForSlide(slideNum) {
            if (audio) {
                audio.pause();
                audio = null;
            }
            
            const slideNumStr = slideNum.toString().padStart(2, '0');
            const audioSrc = `/assets/pitch/voice/slide_${slideNumStr}.mp3`;
            
            audio = new Audio(audioSrc);
            audio.playbackRate = currentSpeed;
            audio.volume = isMuted ? 0 : 1;
            
            // Update progress bar
            audio.addEventListener('loadedmetadata', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('timeupdate', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('ended', () => {
                isPlaying = false;
                updatePlayPauseButton();
                // Auto-advance to next slide
                if (autoAdvance && currentSlide < totalSlides) {
                    setTimeout(() => {
                        nextSlide();
                    }, 500);
                }
            });
            
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
            });
        }
        
        // Update audio progress bar
        function updateAudioProgress() {
            if (audio && audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('audio-progress-bar').style.width = progress + '%';
            }
        }
        
        // Seek audio on progress bar click
        document.getElementById('audio-progress').addEventListener('click', function(e) {
            if (audio && audio.duration) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = x / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });
        
        // Update slide counter
        function updateSlideCounter() {
            document.getElementById('slide-counter').textContent = `Slide ${currentSlide} / ${totalSlides}`;
            document.getElementById('prev-btn').disabled = currentSlide === 1;
            document.getElementById('next-btn').disabled = currentSlide === totalSlides;
        }
        
        // Update play/pause button
        function updatePlayPauseButton() {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const playPauseText = document.getElementById('play-pause-text');
            const btn = document.getElementById('play-pause-btn');
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playPauseText.textContent = 'Pause';
                btn.classList.add('active');
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playPauseText.textContent = 'Play';
                btn.classList.remove('active');
            }
        }
        
        // Navigate to slide
        function goToSlide(slideNum) {
            if (slideNum < 1 || slideNum > totalSlides) return;
            
            currentSlide = slideNum;
            updateSlideCounter();
            
            // Reload iframe with new slide (Office Web Viewer will show from start, but we track the slide)
            slideViewer.src = getSlideUrl(slideNum);
            
            // Load and play audio for this slide
            loadAudioForSlide(slideNum);
            
            // Auto-play if was playing
            if (isPlaying) {
                setTimeout(() => {
                    if (audio) {
                        audio.play().catch(err => {
                            console.error('Play error:', err);
                        });
                    }
                }, 500);
            }
        }
        
        // Previous slide
        function prevSlide() {
            if (currentSlide > 1) {
                goToSlide(currentSlide - 1);
            }
        }
        
        // Next slide
        function nextSlide() {
            if (currentSlide < totalSlides) {
                goToSlide(currentSlide + 1);
            }
        }
        
        // Play/Pause button
        document.getElementById('play-pause-btn').addEventListener('click', function() {
            if (!audio) {
                loadAudioForSlide(currentSlide);
            }
            
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play().catch(err => {
                    console.error('Play error:', err);
                });
                isPlaying = true;
            }
            updatePlayPauseButton();
        });
        
        // Mute button
        document.getElementById('mute-btn').addEventListener('click', function() {
            isMuted = !isMuted;
            if (audio) {
                audio.volume = isMuted ? 0 : 1;
            }
            
            const muteIcon = document.getElementById('mute-icon');
            const unmuteIcon = document.getElementById('unmute-icon');
            const muteText = document.getElementById('mute-text');
            
            if (isMuted) {
                muteIcon.style.display = 'none';
                unmuteIcon.style.display = 'block';
                muteText.textContent = 'Unmute';
            } else {
                muteIcon.style.display = 'block';
                unmuteIcon.style.display = 'none';
                muteText.textContent = 'Mute';
            }
        });
        
        // Speed button
        document.getElementById('speed-btn').addEventListener('click', function() {
            const speedIndex = speeds.indexOf(currentSpeed);
            const nextIndex = (speedIndex + 1) % speeds.length;
            currentSpeed = speeds[nextIndex];
            document.getElementById('speed-text').textContent = currentSpeed + '×';
            
            if (audio) {
                audio.playbackRate = currentSpeed;
            }
            
            if (currentSpeed !== 1) {
                this.classList.add('active');
            } else {
                this.classList.remove('active');
            }
        });
        
        // Previous/Next buttons
        document.getElementById('prev-btn').addEventListener('click', prevSlide);
        document.getElementById('next-btn').addEventListener('click', nextSlide);
        
        // Download button
        document.getElementById('download-btn').addEventListener('click', function() {
            window.open('/assets/pitch/daena_pitch_deck.pptx', '_blank');
        });
        
        // Fullscreen button
        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const container = document.querySelector('.slide-container');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.mozRequestFullScreen) {
                container.mozRequestFullScreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            // Don't trigger if user is typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                return;
            }
            
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'ArrowRight' || (e.key === ' ' && !e.target.tagName === 'BUTTON')) {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                document.getElementById('play-pause-btn').click();
            } else if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                document.getElementById('mute-btn').click();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                document.getElementById('fullscreen-btn').click();
            }
        });
        
        // Load voice-over list
        function loadVoiceList() {
            const voiceList = document.getElementById('voice-list');
            
            fetch('/assets/pitch/voice/manifest.json')
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Manifest not found');
                })
                .then(data => {
                    data.items.forEach(item => {
                        const li = document.createElement('li');
                        const slideNum = item.slide.toString().padStart(2, '0');
                        li.innerHTML = `
                            <span>Slide ${slideNum}</span>
                            <audio controls preload="metadata" src="/assets/pitch/voice/${item.file}"></audio>
                        `;
                        voiceList.appendChild(li);
                    });
                })
                .catch(() => {
                    // Fallback: generate list from expected files
                    for (let i = 1; i <= totalSlides; i++) {
                        const slideNum = i.toString().padStart(2, '0');
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>Slide ${slideNum}</span>
                            <audio controls preload="metadata" src="/assets/pitch/voice/slide_${slideNum}.mp3"></audio>
                        `;
                        voiceList.appendChild(li);
                    }
                });
        }
        
        // Initialize
        updateSlideCounter();
        loadVoiceList();
        
        // Auto-start: Load first slide audio and start playing
        setTimeout(() => {
            loadAudioForSlide(1);
            isPlaying = true;
            updatePlayPauseButton();
            audio.play().catch(err => {
                console.log('Auto-play prevented:', err);
                isPlaying = false;
                updatePlayPauseButton();
            });
        }, 1000);
    </script>
</body>
</html>
