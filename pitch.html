<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Live Pitch Deck | Daena AI | MAS-AI</title>
    <meta name="description" content="Daena AI Pitch Deck with live PowerPoint animations. View, download PDF, or listen to voice-overs per slide.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .pitch-container {
            min-height: 100vh;
            padding: 2rem;
            padding-top: 6rem;
        }
        
        .office-viewer {
            width: 100%;
            height: 720px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .download-section {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #FFD700;
        }
        
        .btn-primary:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.7);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .voice-list {
            margin-top: 3rem;
        }
        
        .voice-list details {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .voice-list summary {
            cursor: pointer;
            font-size: 1.125rem;
            font-weight: 600;
            color: #FFD700;
            padding: 0.5rem;
            user-select: none;
        }
        
        .voice-list summary:hover {
            color: #FFED4E;
        }
        
        .voice-list ul {
            margin-top: 1rem;
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .voice-list li {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .voice-list li span {
            min-width: 80px;
            font-weight: 500;
            color: #e5e7eb;
        }
        
        .voice-list audio {
            flex: 1;
            max-width: 100%;
        }
        
        @media (max-width: 768px) {
            .office-viewer {
                height: 500px;
            }
            
            .pitch-container {
                padding: 1rem;
                padding-top: 5rem;
            }
            
            .voice-list li {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .voice-list li span {
                min-width: auto;
            }
            
            .voice-list audio {
                width: 100%;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-[100]" role="navigation" aria-label="Main navigation"
        style="pointer-events: none;">
        <div class="max-w-7xl mx-auto px-4 pt-4" style="pointer-events: auto;">
            <div class="glass-card flex items-center justify-between p-4" style="position: relative; z-index: 100;">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <section class="pitch-container container mx-auto">
        <h1 class="text-3xl font-semibold mb-6 text-center">Live Pitch Deck</h1>
        <p class="text-center text-gray-300 mb-6">View the interactive presentation with original PowerPoint animations</p>
        
        <!-- Office Web Viewer -->
        <div class="w-full">
            <iframe
                id="office-viewer"
                class="office-viewer"
                title="Daena Pitch Deck (Live with animations)"
                src=""
                frameborder="0"
                allowfullscreen
            ></iframe>
        </div>
        
        <!-- Download Section -->
        <div class="download-section">
            <a class="btn btn-primary" href="/assets/pitch/daena_pitch_deck.pdf" download>
                📥 Download PDF
            </a>
            <a class="btn btn-secondary" href="/assets/pitch/daena_pitch_deck.pptx" download>
                📥 Download PPTX
            </a>
        </div>
        
        <!-- Voice Over List -->
        <div class="voice-list">
            <details>
                <summary>Voice overs (per slide)</summary>
                <ul id="voice-list"></ul>
            </details>
        </div>
    </section>
    
    <script>
        // Get the current origin
        const origin = window.location.origin;
        const pptUrl = `${origin}/assets/pitch/daena_pitch_deck.pptx`;
        
        // Office Web Viewer URL (requires HTTPS in production)
        const officeEmbed = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(pptUrl)}`;
        
        // Set iframe source
        document.getElementById('office-viewer').src = officeEmbed;
        
        // Load voice-over list
        function loadVoiceList() {
            const voiceList = document.getElementById('voice-list');
            const maxSlides = 20; // Adjust based on your deck size
            
            // Try to load manifest first
            fetch('/assets/pitch/voice/manifest.json')
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Manifest not found');
                })
                .then(data => {
                    // Use manifest data
                    data.items.forEach(item => {
                        const li = document.createElement('li');
                        const slideNum = item.slide.toString().padStart(2, '0');
                        li.innerHTML = `
                            <span>Slide ${slideNum}</span>
                            <audio controls preload="metadata" src="/assets/pitch/voice/${item.file}"></audio>
                        `;
                        voiceList.appendChild(li);
                    });
                })
                .catch(() => {
                    // Fallback: generate list from expected files
                    for (let i = 1; i <= maxSlides; i++) {
                        const slideNum = i.toString().padStart(2, '0');
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>Slide ${slideNum}</span>
                            <audio controls preload="metadata" src="/assets/pitch/voice/slide_${slideNum}.mp3"></audio>
                        `;
                        voiceList.appendChild(li);
                    }
                });
        }
        
        // Initialize voice list
        loadVoiceList();
    </script>
</body>
</html>
