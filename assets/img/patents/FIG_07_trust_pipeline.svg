<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="tA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3BE5C8"/></marker>
    <marker id="tG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#84FFA0"/></marker>
    <marker id="tR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#FF6B6B"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#0B1020"/>
  <text x="600" y="40" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="22" font-weight="bold">FIG. 7 - Trust Validation Pipeline</text>
  <!-- Entry: New Memory in L2Q -->
  <rect x="420" y="65" width="360" height="55" rx="8" fill="#2a2a10" stroke="#FFD700" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" fill="#FFD700" font-family="Arial,sans-serif" font-size="15" font-weight="bold">New Memory Enters L2Q</text>
  <text x="600" y="107" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11">trust_score = 0.0 | is_quarantined = True</text>
  <line x1="600" y1="120" x2="600" y2="160" stroke="#3BE5C8" stroke-width="2" marker-end="url(#tA)"/>
  <!-- Check: success_flag -->
  <polygon points="600,160 730,210 600,260 470,210" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="600" y="207" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">success_flag?</text>
  <!-- success_flag = False path -->
  <line x1="470" y1="210" x2="300" y2="210" stroke="#FF6B6B" stroke-width="2" marker-end="url(#tR)"/>
  <text x="390" y="202" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="10">FALSE</text>
  <!-- Failure count check -->
  <polygon points="200,210 300,250 200,290 100,250" fill="#2a1010" stroke="#FF6B6B" stroke-width="2"/>
  <text x="200" y="247" text-anchor="middle" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="10" font-weight="bold">3x failures?</text>
  <!-- Archive -->
  <line x1="200" y1="290" x2="200" y2="340" stroke="#FF6B6B" stroke-width="2" marker-end="url(#tR)"/>
  <rect x="120" y="340" width="160" height="45" rx="6" fill="#2a1010" stroke="#FF6B6B" stroke-width="2"/>
  <text x="200" y="360" text-anchor="middle" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="12" font-weight="bold">ARCHIVE</text>
  <text x="200" y="377" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="9">Anti-pattern recorded</text>
  <text x="215" y="330" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="10">YES</text>
  <!-- Not yet 3x failures: stay -->
  <line x1="100" y1="250" x2="30" y2="250" stroke="#FFD700" stroke-width="2"/>
  <text x="60" y="242" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">NO</text>
  <rect x="10" y="270" width="120" height="35" rx="6" fill="#1a1a30" stroke="#FFD700" stroke-width="1.5"/>
  <text x="70" y="293" text-anchor="middle" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">Stay in L2Q</text>
  <!-- success_flag = True path -->
  <line x1="730" y1="210" x2="870" y2="210" stroke="#84FFA0" stroke-width="2" marker-end="url(#tG)"/>
  <text x="790" y="202" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">TRUE</text>
  <!-- Repetition check -->
  <polygon points="970,210 1100,260 970,310 840,260" fill="#1a2a4a" stroke="#84FFA0" stroke-width="2"/>
  <text x="970" y="250" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">3+ same hash</text>
  <text x="970" y="268" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">successes?</text>
  <!-- Direct promotion on 3x -->
  <line x1="1100" y1="260" x2="1160" y2="260" stroke="#84FFA0" stroke-width="2"/>
  <text x="1115" y="252" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">YES</text>
  <line x1="1160" y1="260" x2="1160" y2="420" stroke="#84FFA0" stroke-width="2"/>
  <line x1="1160" y1="420" x2="780" y2="420" stroke="#84FFA0" stroke-width="2" marker-end="url(#tG)"/>
  <!-- Not yet 3x: bump trust -->
  <line x1="970" y1="310" x2="970" y2="360" stroke="#3BE5C8" stroke-width="2" marker-end="url(#tA)"/>
  <text x="985" y="340" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="10">NO</text>
  <rect x="870" y="360" width="200" height="50" rx="6" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="970" y="383" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Bump trust +0.1</text>
  <text x="970" y="401" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="10">trust_score += 0.1 (max 1.0)</text>
  <!-- Threshold check -->
  <line x1="970" y1="410" x2="970" y2="450" stroke="#3BE5C8" stroke-width="2" marker-end="url(#tA)"/>
  <polygon points="970,450 1080,490 970,530 860,490" fill="#1a2a4a" stroke="#84FFA0" stroke-width="2"/>
  <text x="970" y="490" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">score &gt;= 0.7?</text>
  <!-- No: stay -->
  <line x1="860" y1="490" x2="760" y2="490" stroke="#FFD700" stroke-width="2"/>
  <text x="810" y="482" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">NO</text>
  <rect x="660" y="470" width="100" height="40" rx="6" fill="#1a1a30" stroke="#FFD700" stroke-width="1.5"/>
  <text x="710" y="495" text-anchor="middle" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">Stay L2Q</text>
  <!-- Yes: promote -->
  <line x1="970" y1="530" x2="970" y2="570" stroke="#84FFA0" stroke-width="2" marker-end="url(#tG)"/>
  <text x="985" y="555" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">YES</text>
  <!-- Promote to L2 -->
  <rect x="420" y="400" width="360" height="55" rx="8" fill="#1a3a2a" stroke="#84FFA0" stroke-width="3"/>
  <text x="600" y="425" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="16" font-weight="bold">PROMOTE TO L2 WARM</text>
  <text x="600" y="445" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11">is_quarantined=False | trust_score=0.8</text>
  <!-- Also promote from threshold check -->
  <rect x="870" y="570" width="200" height="45" rx="8" fill="#1a3a2a" stroke="#84FFA0" stroke-width="2"/>
  <text x="970" y="597" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">PROMOTE TO L2</text>
  <!-- Lineage -->
  <line x1="600" y1="455" x2="600" y2="500" stroke="#FFD700" stroke-width="2" marker-end="url(#tA)"/>
  <rect x="420" y="500" width="360" height="40" rx="6" fill="#1a1a30" stroke="#FFD700" stroke-width="1.5"/>
  <text x="600" y="525" text-anchor="middle" fill="#FFD700" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Lineage Records Promotion Event</text>
  <!-- Immune watching -->
  <rect x="60" y="480" width="280" height="100" rx="8" fill="#2a1a1a" stroke="#FF6B6B" stroke-width="2"/>
  <text x="200" y="507" text-anchor="middle" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IMMUNE WATCHES</text>
  <line x1="80" y1="515" x2="320" y2="515" stroke="#333" stroke-width="1"/>
  <text x="90" y="535" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">Anomalous access patterns</text>
  <text x="90" y="555" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">Policy breach during promotion</text>
  <text x="90" y="572" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Rollback: demote tier, re-quarantine</text>
  <!-- Arrow from Immune to L2 -->
  <line x1="340" y1="510" x2="420" y2="430" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="370" y="458" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="9">Rollback</text>
  <!-- Patent -->
  <text x="600" y="790" text-anchor="middle" fill="#555555" font-family="Arial,sans-serif" font-size="9">Patent Pending - MAS-AI Technologies Inc.</text>
</svg>