<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3BE5C8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#84FFA0"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#0B1020"/>
  <text x="600" y="40" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="22" font-weight="bold">FIG. 3 - NBMF Read Path (eDNA-Gated)</text>
  <!-- Query -->
  <rect x="480" y="65" width="240" height="45" rx="22" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="600" y="93" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">QUERY ARRIVES</text>
  <line x1="600" y1="110" x2="600" y2="140" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Genome Check -->
  <polygon points="600,140 710,185 600,230 490,185" fill="#1a3a2a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">eDNA Genome</text>
  <text x="600" y="196" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">Permission OK?</text>
  <!-- Reject -->
  <line x1="710" y1="185" x2="830" y2="185" stroke="#FF6B6B" stroke-width="2"/>
  <rect x="830" y="165" width="120" height="40" rx="6" fill="#2a1010" stroke="#FF6B6B" stroke-width="1.5"/>
  <text x="890" y="190" text-anchor="middle" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="11" font-weight="bold">ACCESS DENIED</text>
  <text x="760" y="178" fill="#FF6B6B" font-family="Arial,sans-serif" font-size="10">NO</text>
  <!-- Yes -->
  <text x="575" y="245" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">YES</text>
  <line x1="600" y1="230" x2="600" y2="265" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- L1 Search -->
  <rect x="480" y="265" width="240" height="50" rx="6" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="13" font-weight="bold">L1 Hot Search</text>
  <text x="600" y="305" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="10">&lt;25ms p95 | Vector cache lookup</text>
  <line x1="600" y1="315" x2="600" y2="345" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Found in L1? -->
  <polygon points="600,345 700,385 600,425 500,385" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11">Found?</text>
  <!-- Yes: confidence check -->
  <line x1="700" y1="385" x2="830" y2="385" stroke="#84FFA0" stroke-width="2" marker-end="url(#ag)"/>
  <text x="755" y="377" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">YES</text>
  <rect x="830" y="365" width="180" height="40" rx="6" fill="#1a3a2a" stroke="#84FFA0" stroke-width="1.5"/>
  <text x="920" y="390" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Confidence &gt;= 0.7?</text>
  <!-- High confidence: return -->
  <line x1="1010" y1="385" x2="1080" y2="385" stroke="#84FFA0" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="1020" y="340" width="140" height="40" rx="6" fill="#1a3a2a" stroke="#3BE5C8" stroke-width="2"/>
  <text x="1090" y="358" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Return with</text>
  <text x="1090" y="373" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="9">Provenance Citation</text>
  <!-- No found: L2 fallback -->
  <text x="575" y="440" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">NO</text>
  <line x1="600" y1="425" x2="600" y2="460" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- L2 Warm Fallback -->
  <rect x="480" y="460" width="240" height="50" rx="6" fill="#1a2a4a" stroke="#84FFA0" stroke-width="2"/>
  <text x="600" y="483" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="13" font-weight="bold">L2 Warm Fallback</text>
  <text x="600" y="500" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="10">Validated experiences | trust &gt;= 0.7</text>
  <line x1="600" y1="510" x2="600" y2="540" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Found in L2? -->
  <polygon points="600,540 700,575 600,610 500,575" fill="#1a2a4a" stroke="#84FFA0" stroke-width="2"/>
  <text x="600" y="578" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11">Found?</text>
  <text x="575" y="625" fill="#FFD700" font-family="Arial,sans-serif" font-size="10">NO</text>
  <line x1="600" y1="610" x2="600" y2="645" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Yes from L2 -->
  <line x1="700" y1="575" x2="830" y2="575" stroke="#84FFA0" stroke-width="2" marker-end="url(#ag)"/>
  <text x="755" y="567" fill="#84FFA0" font-family="Arial,sans-serif" font-size="10">YES</text>
  <rect x="830" y="555" width="180" height="40" rx="6" fill="#1a3a2a" stroke="#84FFA0" stroke-width="1.5"/>
  <text x="920" y="580" text-anchor="middle" fill="#84FFA0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Return with Provenance</text>
  <!-- L3 Decompress -->
  <rect x="480" y="645" width="240" height="50" rx="6" fill="#1a2a4a" stroke="#6688BB" stroke-width="2"/>
  <text x="600" y="668" text-anchor="middle" fill="#6688BB" font-family="Arial,sans-serif" font-size="13" font-weight="bold">L3 Cold Decompress</text>
  <text x="600" y="685" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="10">On-demand decompression from archive</text>
  <line x1="600" y1="695" x2="600" y2="725" stroke="#3BE5C8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Lossless pointer fallback -->
  <rect x="480" y="725" width="240" height="40" rx="6" fill="#1a2a4a" stroke="#3BE5C8" stroke-width="1.5"/>
  <text x="600" y="742" text-anchor="middle" fill="#3BE5C8" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Lossless Pointer Fallback</text>
  <text x="600" y="758" text-anchor="middle" fill="#aaaaaa" font-family="Arial,sans-serif" font-size="9">If semantic confidence low, use lossless</text>
  <!-- Note about quarantine exclusion -->
  <rect x="80" y="280" width="280" height="65" rx="6" fill="#2a1a10" stroke="#FFD700" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" fill="#FFD700" font-family="Arial,sans-serif" font-size="11" font-weight="bold">QUARANTINE EXCLUSION</text>
  <text x="220" y="318" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">L2Q entries (is_quarantined=True)</text>
  <text x="220" y="333" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">are NEVER returned in read path</text>
  <!-- Patent notice -->
  <text x="600" y="790" text-anchor="middle" fill="#555555" font-family="Arial,sans-serif" font-size="9">Patent Pending - MAS-AI Technologies Inc.</text>
</svg>