<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Complete overview of Daena AI platform: architecture, features, and capabilities. Learn about our revolutionary multi-agent system.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Utilities CSS -->
    <link rel="stylesheet" href="/assets/css/utilities.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --cyan: #22d3ee;
            --gold: #fbbf24;
            --purple: #a78bfa;
        }
        
        body {
            background: #0f172a; /* slate-900 */
            color: #e2e8f0; /* slate-200 */
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-gold-400 bg-clip-text text-transparent">
                    Daena AI
                </a>
                <div class="flex gap-6">
                    <a href="/" class="text-slate-300 hover:text-white transition-colors">Home</a>
                    <a href="/overview.html" class="text-cyan-400 font-semibold">Overview</a>
                    <a href="/for-developers.html" class="text-slate-300 hover:text-white transition-colors">Developers</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div hx-get="/templates/partials/daena/hero.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Architecture Section -->
    <div hx-get="/templates/partials/daena/architecture.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- NBMF Section -->
    <div hx-get="/templates/partials/daena/nbmf.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Enterprise DNA Section -->
    <div hx-get="/templates/partials/daena/edna.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Benchmarks Section -->
    <div hx-get="/templates/partials/daena/benchmarks.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Audits Section -->
    <div hx-get="/templates/partials/daena/audits.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Pilots Section -->
    <div hx-get="/templates/partials/daena/pilots.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- CTA Section -->
    <div hx-get="/templates/partials/daena/cta.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-700 py-12">
        <div class="container mx-auto px-4 text-center text-slate-400">
            <p>&copy; 2025 MAS-AI Inc. All rights reserved.</p>
        </div>
    </footer>

    <!-- HTMX metric popover handler -->
    <script>
        // Handle metric note clicks for static site
        document.body.addEventListener('click', function(e) {
            if (e.target.classList.contains('metric-note')) {
                const metricId = e.target.getAttribute('hx-get')?.match(/id=(\w+)/)?.[1];
                if (metricId) {
                    fetch('/public/metrics.json')
                        .then(r => r.json())
                        .then(metrics => {
                            const metric = metrics[metricId];
                            if (metric) {
                                const popover = document.getElementById('metric-popover');
                                if (popover) {
                                    popover.innerHTML = `
                                        <div class="metric-details">
                                            <h4 class="font-semibold text-white mb-2">${metric.title}</h4>
                                            <p class="text-slate-300 text-sm leading-snug mb-2">${metric.description}</p>
                                            <p class="text-slate-400 text-xs italic">Source: ${metric.source}</p>
                                        </div>
                                    `;
                                    popover.classList.remove('hidden');
                                    
                                    // Close on outside click
                                    setTimeout(() => {
                                        document.addEventListener('click', function closePopover(ev) {
                                            if (!popover.contains(ev.target) && !e.target.contains(ev.target)) {
                                                popover.classList.add('hidden');
                                                document.removeEventListener('click', closePopover);
                                            }
                                        }, { once: true });
                                    }, 100);
                                }
                            }
                        });
                }
            }
        });
    </script>
</body>
</html>
