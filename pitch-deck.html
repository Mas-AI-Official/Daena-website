<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daena Pitch Deck with Narration | MAS-AI</title>
    <meta name="description" content="13-slide investor presentation with voice-over narration for Daena AI VP.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .slide-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .slide {
            max-width: 1200px;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            position: relative;
            overflow: hidden;
        }
        
        .slide.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }
        
        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        
        .slide-content {
            text-align: center;
            color: white;
            width: 100%;
        }
        
        .slide-content h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 1rem;
            color: #FFD700;
        }
        
        .slide-content p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.6;
            color: #e5e7eb;
        }
        
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }
        
        .controls button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .slide-counter {
            color: white;
            font-size: 0.875rem;
            min-width: 80px;
            text-align: center;
        }
        
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .audio-controls button {
            padding: 0.5rem;
            min-width: 2.5rem;
        }
        
        .audio-speed-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 3rem;
        }
        
        .audio-speed-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .audio-speed-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            color: #FFD700;
        }
        
        .audio-progress {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .audio-progress-bar {
            height: 100%;
            background: #FFD700;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .audio-progress:hover {
            height: 6px;
        }
        
        @media (max-width: 768px) {
            .slide {
                padding: 1rem;
            }
            
            .controls {
                bottom: 1rem;
                padding: 0.75rem;
                gap: 0.5rem;
                flex-wrap: wrap;
                max-width: calc(100% - 2rem);
                left: 1rem;
                right: 1rem;
                transform: none;
            }
            
            .controls button {
                padding: 0.5rem 0.75rem;
                font-size: 0.75rem;
                flex: 1 1 auto;
                min-width: auto;
            }
            
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                flex-shrink: 0;
            }
            
            .audio-controls {
                flex-wrap: wrap;
                gap: 0.375rem;
            }
            
            .audio-progress {
                width: 60px;
            }
            
            .audio-speed-btn {
                padding: 0.375rem 0.5rem;
                font-size: 0.75rem;
                min-width: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .controls {
                bottom: 0.5rem;
                padding: 0.5rem;
                gap: 0.375rem;
            }
            
            .controls button {
                padding: 0.375rem 0.5rem;
                font-size: 0.7rem;
            }
            
            .slide-counter {
                font-size: 0.7rem;
                min-width: 45px;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50" role="navigation" aria-label="Main navigation">
        <div class="max-w-7xl mx-auto px-4 pt-4">
            <div class="glass-card flex items-center justify-between p-4">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- Slide Container -->
    <div class="slide-container mt-20">
        <!-- Slides will be dynamically loaded -->
        <div id="slides-container"></div>
    </div>
    
    <!-- Controls -->
    <div class="controls">
        <button id="prev-btn" aria-label="Previous slide">← Prev</button>
        <div class="audio-controls">
            <button id="audio-toggle" aria-label="Play/Pause audio">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
            </button>
            <div class="audio-progress">
                <div class="audio-progress-bar" id="audio-progress"></div>
            </div>
            <button id="audio-speed" class="audio-speed-btn" aria-label="Playback Speed">1×</button>
        </div>
        <span class="slide-counter" id="slide-counter">1 / 14</span>
        <button id="next-btn" aria-label="Next slide">Next →</button>
    </div>
    
    <script>
        // Slide data with images and audio - 14 slides total
        const slides = [
            { image: '/images/slide-1.png', audio: '/assets/pitch/voice/slide_01.mp3' },
            { image: '/images/slide-2.png', audio: '/assets/pitch/voice/slide_02.mp3' },
            { image: '/images/slide-3.png', audio: '/assets/pitch/voice/slide_03.mp3' },
            { image: '/images/slide-4.png', audio: '/assets/pitch/voice/slide_04.mp3' },
            { image: '/images/slide-5.png', audio: '/assets/pitch/voice/slide_05.mp3' },
            { image: '/images/slide-6.png', audio: '/assets/pitch/voice/slide_06.mp3' },
            { image: '/images/slide-7.png', audio: '/assets/pitch/voice/slide_07.mp3' },
            { image: '/images/slide-8.png', audio: '/assets/pitch/voice/slide_08.mp3' },
            { image: '/images/slide-9.png', audio: '/assets/pitch/voice/slide_09.mp3' },
            { image: '/images/slide-10.png', audio: '/assets/pitch/voice/slide_10.mp3' },
            { image: '/images/slide-11.png', audio: '/assets/pitch/voice/slide_11.mp3' },
            { image: '/images/slide-12.png', audio: '/assets/pitch/voice/slide_12.mp3' },
            { image: '/images/slide-13.png', audio: '/assets/pitch/voice/slide_13.mp3' },
            { image: '/images/slide-14.png', audio: '/assets/pitch/voice/slide_14.mp3' }
        ];
        
        let currentSlide = 0;
        let audio = null;
        let isPlaying = false;
        let wasPlayingBeforeNavigation = false; // Track if audio was playing before navigation
        const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
        let currentSpeedIndex = 1;
        
        // Initialize slides
        function initSlides() {
            const container = document.getElementById('slides-container');
            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                slideDiv.id = `slide-${index}`;
                
                const img = document.createElement('img');
                img.src = slide.image;
                img.alt = `Slide ${index + 1}`;
                img.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'slide-content';
                    placeholder.innerHTML = `<h2>Slide ${index + 1}</h2><p>Loading...</p>`;
                    slideDiv.appendChild(placeholder);
                };
                
                slideDiv.appendChild(img);
                container.appendChild(slideDiv);
            });
        }
        
        // Update slide counter
        function updateCounter() {
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
        }
        
        // Show slide - with proper audio synchronization
        function showSlide(index, preservePlayingState = false) {
            console.log('showSlide called:', index, 'preservePlayingState:', preservePlayingState);
            
            // Store current playing state before stopping audio
            wasPlayingBeforeNavigation = isPlaying && audio && !audio.paused;
            
            // Stop and clean up current audio IMMEDIATELY
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                // Remove all event listeners to prevent memory leaks
                audio.removeEventListener('loadedmetadata', updateAudioProgress);
                audio.removeEventListener('timeupdate', updateAudioProgress);
                audio.removeEventListener('ended', handleAudioEnded);
                audio.removeEventListener('error', handleAudioError);
                audio = null;
            }
            
            isPlaying = false;
            updateAudioButton();
            
            // Hide all slides
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            
            // Show current slide
            const slide = document.getElementById(`slide-${index}`);
            if (slide) {
                slide.classList.add('active');
            }
            
            // Update currentSlide index
            currentSlide = index;
            
            // Load and play audio for this slide
            loadAudio(slides[index].audio, preservePlayingState || wasPlayingBeforeNavigation);
            
            // Update buttons
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === slides.length - 1;
            
            updateCounter();
        }
        
        // Handle audio ended event
        function handleAudioEnded() {
            console.log('Audio ended for slide', currentSlide + 1);
            isPlaying = false;
            updateAudioButton();
            // Auto-advance to next slide if not last
            if (currentSlide < slides.length - 1) {
                setTimeout(() => {
                    nextSlide();
                }, 500);
            }
        }
        
        // Handle audio error
        function handleAudioError(e) {
            console.error('Audio error for slide', currentSlide + 1, ':', e);
            isPlaying = false;
            updateAudioButton();
        }
        
        // Load audio with proper synchronization
        function loadAudio(audioSrc, autoPlay = false) {
            console.log('loadAudio called:', audioSrc, 'autoPlay:', autoPlay);
            
            // Create new audio instance
            audio = new Audio(audioSrc);
            audio.playbackRate = speeds[currentSpeedIndex]; // Set current speed
            
            // Add event listeners
            audio.addEventListener('loadedmetadata', () => {
                updateAudioProgress();
            });
            audio.addEventListener('timeupdate', () => {
                updateAudioProgress();
            });
            audio.addEventListener('ended', handleAudioEnded);
            audio.addEventListener('error', handleAudioError);
            
            // Auto-play if requested
            if (autoPlay) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio started playing for slide', currentSlide + 1);
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.log('Auto-play prevented for slide', currentSlide + 1, ':', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
        }
        
        // Update audio progress
        function updateAudioProgress() {
            if (audio && audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('audio-progress').style.width = progress + '%';
            }
        }
        
        // Seek audio when clicking on progress bar
        function setupProgressBarSeek() {
            const progressBar = document.querySelector('.audio-progress');
            if (progressBar) {
                progressBar.addEventListener('click', (e) => {
                    if (!audio || !audio.duration) return;
                    
                    const rect = progressBar.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percentage = clickX / rect.width;
                    const newTime = percentage * audio.duration;
                    
                    audio.currentTime = Math.max(0, Math.min(newTime, audio.duration));
                    updateAudioProgress();
                    console.log('Seeked to', newTime.toFixed(2), 'seconds (', (percentage * 100).toFixed(1), '%)');
                });
            }
        }
        
        // Toggle audio - ensures audio is loaded for current slide
        function toggleAudio() {
            // If no audio loaded, load it first
            if (!audio) {
                loadAudio(slides[currentSlide].audio, true);
                return;
            }
            
            if (isPlaying && !audio.paused) {
                audio.pause();
                isPlaying = false;
                console.log('Audio paused');
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            isPlaying = true;
                            console.log('Audio resumed');
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.error('Play error:', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
            updateAudioButton();
        }
        
        // Update audio button
        function updateAudioButton() {
            const btn = document.getElementById('audio-toggle');
            if (isPlaying) {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';
            } else {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>';
            }
        }
        
        // Navigation - with proper audio synchronization
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                showSlide(currentSlide + 1, wasPlaying);
            }
        }
        
        function prevSlide() {
            if (currentSlide > 0) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                showSlide(currentSlide - 1, wasPlaying);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                toggleAudio();
            }
        });
        
        // Speed control - updates current audio immediately
        function changeSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            const newSpeed = speeds[currentSpeedIndex];
            if (audio) {
                audio.playbackRate = newSpeed;
                console.log('Speed changed to', newSpeed, '×');
            }
            const speedBtn = document.getElementById('audio-speed');
            if (speedBtn) {
                speedBtn.textContent = `${newSpeed}×`;
                speedBtn.classList.toggle('active', newSpeed > 1);
            }
        }
        
        // Event listeners
        document.getElementById('next-btn').addEventListener('click', nextSlide);
        document.getElementById('prev-btn').addEventListener('click', prevSlide);
        document.getElementById('audio-toggle').addEventListener('click', toggleAudio);
        document.getElementById('audio-speed').addEventListener('click', changeSpeed);
        
        // Initialize
        initSlides();
        setupProgressBarSeek();
        showSlide(0, true); // Start with first slide and auto-play audio
        
        // Auto-play first slide audio after a short delay (for browser autoplay policies)
        setTimeout(() => {
            if (audio && !isPlaying) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Auto-play started for first slide');
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.log('Auto-play prevented by browser:', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
        }, 500);
    </script>
</body>
</html>
