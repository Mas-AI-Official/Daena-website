<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daena Pitch Deck with Narration | MAS-AI</title>
    <meta name="description" content="14-slide investor presentation with voice-over narration for Daena AI VP.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .slide-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-top: 80px;
        }
        
        .pptx-viewer {
            width: 100%;
            max-width: 1200px;
            height: 675px; /* 16:9 aspect ratio */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }
        
        .pptx-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .fallback-message {
            display: none;
            text-align: center;
            color: white;
            padding: 3rem;
        }
        
        .fallback-message.active {
            display: block;
        }
        
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }
        
        .controls button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .slide-counter {
            color: white;
            font-size: 0.875rem;
            min-width: 80px;
            text-align: center;
        }
        
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .audio-controls button {
            padding: 0.5rem;
            min-width: 2.5rem;
        }
        
        .audio-speed-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 3rem;
        }
        
        .audio-speed-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .audio-speed-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            color: #FFD700;
        }
        
        .audio-progress {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .audio-progress-bar {
            height: 100%;
            background: #FFD700;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .audio-progress:hover {
            height: 6px;
        }
        
        @media (max-width: 768px) {
            .slide-container {
                padding: 1rem;
                margin-top: 60px;
            }
            
            .pptx-viewer {
                height: 400px;
            }
            
            .controls {
                bottom: 1rem;
                padding: 0.75rem;
                gap: 0.5rem;
                flex-wrap: wrap;
                max-width: calc(100% - 2rem);
                left: 1rem;
                right: 1rem;
                transform: none;
            }
            
            .controls button {
                padding: 0.5rem 0.75rem;
                font-size: 0.75rem;
                flex: 1 1 auto;
                min-width: auto;
            }
            
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                flex-shrink: 0;
            }
            
            .audio-controls {
                flex-wrap: wrap;
                gap: 0.375rem;
            }
            
            .audio-progress {
                width: 60px;
            }
            
            .audio-speed-btn {
                padding: 0.375rem 0.5rem;
                font-size: 0.75rem;
                min-width: 2.5rem;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50" role="navigation" aria-label="Main navigation">
        <div class="max-w-7xl mx-auto px-4 pt-4">
            <div class="glass-card flex items-center justify-between p-4">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- PPTX Viewer Container -->
    <div class="slide-container">
        <div class="pptx-viewer" id="pptx-viewer">
            <iframe id="pptx-iframe" title="Daena Pitch Deck" allowfullscreen></iframe>
            <div class="fallback-message" id="fallback-message">
                <h2>Unable to load presentation</h2>
                <p>Please download the PDF or PPTX to view the presentation</p>
                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                    <a href="/assets/pitch/daena_pitch_deck.pdf" target="_blank" class="btn btn-primary">Open PDF</a>
                    <a href="/assets/pitch/daena_pitch_deck.pptx" download class="btn btn-secondary">Download PPTX</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Controls -->
    <div class="controls">
        <button id="prev-btn" aria-label="Previous slide">← Prev</button>
        <div class="audio-controls">
            <button id="audio-toggle" aria-label="Play/Pause audio">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
            </button>
            <div class="audio-progress">
                <div class="audio-progress-bar" id="audio-progress"></div>
            </div>
            <button id="audio-speed" class="audio-speed-btn" aria-label="Playback Speed">1×</button>
        </div>
        <span class="slide-counter" id="slide-counter">1 / 14</span>
        <button id="next-btn" aria-label="Next slide">Next →</button>
    </div>
    
    <script>
        // Slide data with audio - 14 slides total
        const slides = [
            { audio: '/assets/pitch/voice/slide_01.mp3' },
            { audio: '/assets/pitch/voice/slide_02.mp3' },
            { audio: '/assets/pitch/voice/slide_03.mp3' },
            { audio: '/assets/pitch/voice/slide_04.mp3' },
            { audio: '/assets/pitch/voice/slide_05.mp3' },
            { audio: '/assets/pitch/voice/slide_06.mp3' },
            { audio: '/assets/pitch/voice/slide_07.mp3' },
            { audio: '/assets/pitch/voice/slide_08.mp3' },
            { audio: '/assets/pitch/voice/slide_09.mp3' },
            { audio: '/assets/pitch/voice/slide_10.mp3' },
            { audio: '/assets/pitch/voice/slide_11.mp3' },
            { audio: '/assets/pitch/voice/slide_12.mp3' },
            { audio: '/assets/pitch/voice/slide_13.mp3' },
            { audio: '/assets/pitch/voice/slide_14.mp3' }
        ];
        
        let currentSlide = 0;
        let audio = null;
        let isPlaying = false;
        const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
        let currentSpeedIndex = 1;
        let pptxIframe = null;
        
        // Initialize PPTX viewer
        function initPPTXViewer() {
            // Get the full URL for the PPTX file
            const siteUrl = window.location.origin;
            const pptxPath = '/assets/pitch/daena_pitch_deck.pptx';
            const pptxUrl = encodeURIComponent(siteUrl + pptxPath);
            const officeViewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${pptxUrl}`;
            
            console.log('Initializing PPTX viewer with URL:', officeViewerUrl);
            console.log('PPTX file path:', siteUrl + pptxPath);
            
            pptxIframe = document.getElementById('pptx-iframe');
            
            // Add load event listener
            pptxIframe.addEventListener('load', () => {
                console.log('PPTX iframe loaded successfully');
            });
            
            // Handle iframe load errors
            pptxIframe.addEventListener('error', (e) => {
                console.error('Failed to load PPTX viewer:', e);
                showFallback();
            });
            
            // Set the iframe source
            pptxIframe.src = officeViewerUrl;
            
            // Check if iframe loaded successfully after timeout
            let loadCheckTimeout = setTimeout(() => {
                // Check if iframe is visible and has content
                try {
                    const iframe = document.getElementById('pptx-iframe');
                    if (iframe && iframe.contentWindow) {
                        // Iframe exists, check if it's actually displaying content
                        console.log('PPTX iframe check: iframe exists and has contentWindow');
                    } else {
                        console.warn('PPTX iframe may not have loaded properly');
                    }
                } catch (e) {
                    // CORS error is expected when trying to access iframe content
                    console.log('CORS check (expected):', e.message);
                }
            }, 5000);
            
            // Also check for Office Web Viewer specific errors
            window.addEventListener('message', (event) => {
                // Listen for messages from Office Web Viewer
                if (event.origin === 'https://view.officeapps.live.com') {
                    console.log('Message from Office Web Viewer:', event.data);
                }
            });
        }
        
        function showFallback() {
            console.log('Showing fallback message');
            const iframe = document.getElementById('pptx-iframe');
            const fallback = document.getElementById('fallback-message');
            if (iframe) {
                iframe.style.display = 'none';
            }
            if (fallback) {
                fallback.classList.add('active');
            }
        }
        
        // Stop current audio completely
        function stopAudio() {
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                // Remove all event listeners
                const newAudio = audio.cloneNode(false);
                audio = null;
                isPlaying = false;
                updateAudioButton();
                updateAudioProgress();
            }
        }
        
        // Load audio for current slide
        function loadAudioForSlide(slideIndex, autoPlay = false) {
            console.log('Loading audio for slide', slideIndex + 1, 'autoPlay:', autoPlay);
            
            // Stop any existing audio FIRST
            stopAudio();
            
            // Create new audio instance
            const audioSrc = slides[slideIndex].audio;
            audio = new Audio(audioSrc);
            audio.playbackRate = speeds[currentSpeedIndex];
            
            // Add event listeners
            audio.addEventListener('loadedmetadata', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('timeupdate', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('ended', () => {
                console.log('Audio ended for slide', slideIndex + 1);
                isPlaying = false;
                updateAudioButton();
                // Auto-advance to next slide
                if (currentSlide < slides.length - 1) {
                    setTimeout(() => {
                        nextSlide();
                    }, 500);
                }
            });
            
            audio.addEventListener('error', (e) => {
                console.error('Audio error for slide', slideIndex + 1, ':', e);
                isPlaying = false;
                updateAudioButton();
            });
            
            // Auto-play if requested
            if (autoPlay) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio started playing for slide', slideIndex + 1);
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.log('Auto-play prevented:', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
        }
        
        // Send keyboard event to PPTX iframe to control navigation
        function sendKeyToPPTX(key) {
            if (!pptxIframe || !pptxIframe.contentWindow) return;
            
            try {
                const iframeWindow = pptxIframe.contentWindow;
                const event = new KeyboardEvent('keydown', {
                    key: key,
                    code: key === 'ArrowRight' ? 'ArrowRight' : key === 'ArrowLeft' ? 'ArrowLeft' : '',
                    keyCode: key === 'ArrowRight' ? 39 : key === 'ArrowLeft' ? 37 : 0,
                    which: key === 'ArrowRight' ? 39 : key === 'ArrowLeft' ? 37 : 0,
                    bubbles: true,
                    cancelable: true
                });
                
                iframeWindow.dispatchEvent(event);
                iframeWindow.document.dispatchEvent(event);
            } catch (e) {
                // CORS will prevent this, but we try anyway
                console.log('Cannot send key to iframe (CORS):', e.message);
            }
        }
        
        // Navigate to next slide
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                currentSlide++;
                updateSlideCounter();
                updateButtons();
                
                // Try to control PPTX
                sendKeyToPPTX('ArrowRight');
                
                // Load and play audio for new slide
                loadAudioForSlide(currentSlide, wasPlaying);
            }
        }
        
        // Navigate to previous slide
        function prevSlide() {
            if (currentSlide > 0) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                currentSlide--;
                updateSlideCounter();
                updateButtons();
                
                // Try to control PPTX
                sendKeyToPPTX('ArrowLeft');
                
                // Load and play audio for new slide
                loadAudioForSlide(currentSlide, wasPlaying);
            }
        }
        
        // Update slide counter
        function updateSlideCounter() {
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
        }
        
        // Update button states
        function updateButtons() {
            document.getElementById('prev-btn').disabled = currentSlide === 0;
            document.getElementById('next-btn').disabled = currentSlide === slides.length - 1;
        }
        
        // Update audio progress
        function updateAudioProgress() {
            if (audio && audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('audio-progress').style.width = progress + '%';
            } else {
                document.getElementById('audio-progress').style.width = '0%';
            }
        }
        
        // Seek audio when clicking on progress bar
        function setupProgressBarSeek() {
            const progressBar = document.querySelector('.audio-progress');
            if (progressBar) {
                progressBar.addEventListener('click', (e) => {
                    if (!audio || !audio.duration) return;
                    
                    const rect = progressBar.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percentage = clickX / rect.width;
                    const newTime = percentage * audio.duration;
                    
                    audio.currentTime = Math.max(0, Math.min(newTime, audio.duration));
                    updateAudioProgress();
                });
            }
        }
        
        // Toggle audio play/pause
        function toggleAudio() {
            if (!audio) {
                // Load audio for current slide if not loaded
                loadAudioForSlide(currentSlide, true);
                return;
            }
            
            if (isPlaying && !audio.paused) {
                audio.pause();
                isPlaying = false;
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.error('Play error:', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
            updateAudioButton();
        }
        
        // Update audio button icon
        function updateAudioButton() {
            const btn = document.getElementById('audio-toggle');
            if (isPlaying) {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';
            } else {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>';
            }
        }
        
        // Change playback speed
        function changeSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            const newSpeed = speeds[currentSpeedIndex];
            
            if (audio) {
                audio.playbackRate = newSpeed;
            }
            
            const speedBtn = document.getElementById('audio-speed');
            speedBtn.textContent = `${newSpeed}×`;
            speedBtn.classList.toggle('active', newSpeed > 1);
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                toggleAudio();
            }
        });
        
        // Event listeners
        document.getElementById('next-btn').addEventListener('click', nextSlide);
        document.getElementById('prev-btn').addEventListener('click', prevSlide);
        document.getElementById('audio-toggle').addEventListener('click', toggleAudio);
        document.getElementById('audio-speed').addEventListener('click', changeSpeed);
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
        function initialize() {
            console.log('Initializing pitch deck page...');
            initPPTXViewer();
            setupProgressBarSeek();
            updateSlideCounter();
            updateButtons();
            
            // Load audio for first slide and auto-play
            setTimeout(() => {
                loadAudioForSlide(0, true);
            }, 1000);
        }
    </script>
</body>
</html>
