<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daena Pitch Deck | MAS-AI</title>
    <meta name="description" content="14-slide investor presentation with voice-over narration and animations for Daena AI VP.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .presentation-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-top: 80px;
        }
        
        .powerpoint-viewer {
            width: 100%;
            max-width: 1400px;
            height: 787px; /* 16:9 aspect ratio */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }
        
        .powerpoint-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fallback-message {
            display: none;
            text-align: center;
            color: white;
            padding: 3rem;
        }
        
        .fallback-message.active {
            display: block;
        }
        
        .fallback-message .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .fallback-message .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .fallback-message .btn-primary {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            color: #FFD700;
        }
        
        @media (max-width: 768px) {
            .presentation-container {
                padding: 1rem;
                margin-top: 60px;
            }
            
            .powerpoint-viewer {
                height: 500px;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50" role="navigation" aria-label="Main navigation">
        <div class="max-w-7xl mx-auto px-4 pt-4">
            <div class="glass-card flex items-center justify-between p-4">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- PowerPoint Presentation Container -->
    <div class="presentation-container">
        <div class="powerpoint-viewer" id="powerpoint-viewer">
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <p>Loading PowerPoint presentation...</p>
            </div>
            <iframe id="pptx-iframe" title="Daena Pitch Deck" allowfullscreen></iframe>
            <div class="fallback-message" id="fallback-message">
                <h2>Unable to load presentation</h2>
                <p>Please download the PPTX or PDF to view the presentation</p>
                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap;">
                    <a href="/assets/pitch/daena_pitch_deck.pptx" download class="btn btn-primary">Download PPTX</a>
                    <a href="/assets/pitch/daena_pitch_deck.pdf" target="_blank" class="btn">Open PDF</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize PowerPoint viewer
        function initPowerPointViewer() {
            const siteUrl = window.location.origin;
            const pptxPath = '/assets/pitch/daena_pitch_deck.pptx';
            const pptxUrl = encodeURIComponent(siteUrl + pptxPath);
            
            // Use Office Web Viewer to embed PowerPoint with full functionality
            const officeViewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${pptxUrl}`;
            
            console.log('Loading PowerPoint presentation:', officeViewerUrl);
            
            const iframe = document.getElementById('pptx-iframe');
            const loadingOverlay = document.getElementById('loading-overlay');
            
            // Handle iframe load
            iframe.addEventListener('load', () => {
                console.log('PowerPoint presentation loaded');
                // Hide loading overlay after a short delay to ensure content is visible
                setTimeout(() => {
                    if (loadingOverlay) {
                        loadingOverlay.classList.add('hidden');
                    }
                }, 2000);
            });
            
            // Handle iframe errors
            iframe.addEventListener('error', (e) => {
                console.error('Failed to load PowerPoint:', e);
                showFallback();
            });
            
            // Set iframe source
            iframe.src = officeViewerUrl;
            
            // Fallback check after timeout
            setTimeout(() => {
                try {
                    // Check if iframe loaded (will fail due to CORS, but that's expected)
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                } catch (e) {
                    // CORS error is expected - iframe should still be visible
                    console.log('CORS check (expected):', e.message);
                    // Hide loading overlay anyway
                    if (loadingOverlay) {
                        loadingOverlay.classList.add('hidden');
                    }
                }
            }, 5000);
        }
        
        function showFallback() {
            const iframe = document.getElementById('pptx-iframe');
            const loadingOverlay = document.getElementById('loading-overlay');
            const fallbackMessage = document.getElementById('fallback-message');
            
            if (iframe) {
                iframe.style.display = 'none';
            }
            if (loadingOverlay) {
                loadingOverlay.classList.add('hidden');
            }
            if (fallbackMessage) {
                fallbackMessage.classList.add('active');
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPowerPointViewer);
        } else {
            initPowerPointViewer();
        }
    </script>
</body>
</html>
