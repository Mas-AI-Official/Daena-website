<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Daena Pitch Deck | MAS-AI Technologies</title>
    <meta name="description" content="Investor pitch deck for Daena, the governance-first AI agent platform by MAS-AI Technologies. 14-slide presentation with voice-over narration.">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://daena.mas-ai.co/pitch-deck.html">
    <meta name="robots" content="index, follow">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    
    <!-- Metatron Background Script -->
    <script src="/js/metatron-hex-network.js"></script>
    
    <style>
        .presentation-container {
            min-height: 100vh;
            min-height: -webkit-fill-available; /* iOS Safari fix */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-top: 80px;
            margin-bottom: 120px; /* Space for control bar */
            box-sizing: border-box;
        }
        
        .slide-viewer {
            width: 100%;
            max-width: 1400px;
            height: 787px; /* 16:9 aspect ratio */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pan-y pinch-zoom; /* Enable touch gestures */
        }
        
        .slide-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .slide-image.active {
            display: block;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 2rem;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }
        
        .controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(255, 215, 0, 0.3);
            touch-action: manipulation; /* Disable double-tap zoom on buttons */
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 500;
            min-height: 44px; /* iOS touch target minimum */
            min-width: 44px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .controls button:hover:not(:disabled),
        .controls button:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
        }
        
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            touch-action: none;
        }
        
        .slide-counter {
            color: white;
            font-size: 0.875rem;
            min-width: 80px;
            text-align: center;
            font-weight: 600;
        }
        
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .audio-controls button {
            padding: 0.5rem;
            min-width: 2.5rem;
        }
        
        .audio-speed-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 3rem;
        }
        
        .audio-speed-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }
        
        .audio-speed-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            color: #FFD700;
        }
        
        .audio-progress {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .audio-progress-bar {
            height: 100%;
            background: #FFD700;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .audio-progress:hover {
            height: 6px;
        }
        
        /* Mobile and Tablet Styles */
        @media (max-width: 1024px) {
            .presentation-container {
                padding: 1rem;
                margin-top: 60px;
                margin-bottom: 160px; /* More space for mobile controls */
            }
            
            .slide-viewer {
                height: auto;
                min-height: 400px;
                aspect-ratio: 16 / 9;
                max-height: 70vh;
            }
            
            .slide-image {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        }
        
        @media (max-width: 768px) {
            .presentation-container {
                padding: 0.5rem;
                margin-top: 60px;
                margin-bottom: 180px; /* Extra space for mobile controls */
            }
            
            .slide-viewer {
                height: auto;
                min-height: 300px;
                aspect-ratio: 16 / 9;
                max-height: 60vh;
                border-radius: 1rem;
            }
            
            .controls {
                bottom: 0.5rem;
                padding: 0.75rem;
                gap: 0.5rem;
                flex-wrap: wrap;
                max-width: calc(100% - 1rem);
                left: 0.5rem;
                right: 0.5rem;
                transform: none;
                border-radius: 1.5rem;
            }
            
            .controls button {
                padding: 0.75rem 1rem;
                font-size: 0.875rem;
                flex: 1 1 auto;
                min-width: 60px;
                min-height: 44px;
            }
            
            .slide-counter {
                font-size: 0.75rem;
                min-width: 60px;
                flex-shrink: 0;
                padding: 0 0.5rem;
            }
            
            .audio-controls {
                flex-wrap: nowrap;
                gap: 0.5rem;
                width: 100%;
                order: 3;
                margin-top: 0.5rem;
            }
            
            .audio-progress {
                width: 100px;
                flex: 1;
            }
            
            .audio-speed-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.75rem;
                min-width: 50px;
                min-height: 44px;
            }
            
            .audio-controls button {
                min-width: 44px;
                padding: 0.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .presentation-container {
                padding: 0.25rem;
                margin-top: 50px;
                margin-bottom: 200px;
            }
            
            .slide-viewer {
                min-height: 250px;
                max-height: 55vh;
                border-radius: 0.75rem;
            }
            
            .controls {
                bottom: 0.25rem;
                left: 0.25rem;
                right: 0.25rem;
                padding: 0.5rem;
                gap: 0.375rem;
                border-radius: 1.25rem;
            }
            
            .controls button {
                padding: 0.625rem 0.75rem;
                font-size: 0.75rem;
                min-width: 50px;
            }
            
            .slide-counter {
                font-size: 0.7rem;
                min-width: 50px;
            }
            
            .audio-progress {
                width: 80px;
            }
        }
        
        /* Landscape mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .presentation-container {
                margin-bottom: 140px;
            }
            
            .slide-viewer {
                max-height: 75vh;
            }
        }
        
        /* iOS Safari specific fixes */
        @supports (-webkit-touch-callout: none) {
            .presentation-container {
                min-height: -webkit-fill-available;
            }
            
            .slide-viewer {
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body class="text-white antialiased">
    <!-- Metatron Background Layers -->
    <div class="metatron-bg"></div>
    <div class="metatron-pattern-bg"></div>
    <canvas id="metatron-hex-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50" role="navigation" aria-label="Main navigation">
        <div class="max-w-7xl mx-auto px-4 pt-4">
            <div class="glass-card flex items-center justify-between p-4">
                <a href="/" class="text-xl font-bold">Daena</a>
                <a href="/" class="text-sm hover:text-yellow-400 transition">← Back to Home</a>
            </div>
        </div>
    </nav>
    
    <!-- Slide Viewer Container -->
    <div class="presentation-container">
        <div class="slide-viewer" id="slide-viewer">
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <p>Loading presentation...</p>
            </div>
            <!-- Slides will be dynamically loaded here -->
        </div>
    </div>
    
    <!-- Control Bar -->
    <div class="controls" id="controls">
        <button id="prev-btn" aria-label="Previous slide">← Prev</button>
        <div class="audio-controls">
            <button id="audio-toggle" aria-label="Play/Pause audio">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
            </button>
            <div class="audio-progress">
                <div class="audio-progress-bar" id="audio-progress"></div>
            </div>
            <button id="audio-speed" class="audio-speed-btn" aria-label="Playback Speed">1×</button>
        </div>
        <span class="slide-counter" id="slide-counter">1 / 14</span>
        <button id="next-btn" aria-label="Next slide">Next →</button>
    </div>
    
    <script>
        // Slide data with images and audio - 14 slides total
        const slides = [
            { image: '/images/slide-1.png', audio: '/assets/pitch/voice/slide_01.mp3' },
            { image: '/images/slide-2.png', audio: '/assets/pitch/voice/slide_02.mp3' },
            { image: '/images/slide-3.png', audio: '/assets/pitch/voice/slide_03.mp3' },
            { image: '/images/slide-4.png', audio: '/assets/pitch/voice/slide_04.mp3' },
            { image: '/images/slide-5.png', audio: '/assets/pitch/voice/slide_05.mp3' },
            { image: '/images/slide-6.png', audio: '/assets/pitch/voice/slide_06.mp3' },
            { image: '/images/slide-7.png', audio: '/assets/pitch/voice/slide_07.mp3' },
            { image: '/images/slide-8.png', audio: '/assets/pitch/voice/slide_08.mp3' },
            { image: '/images/slide-9.png', audio: '/assets/pitch/voice/slide_09.mp3' },
            { image: '/images/slide-10.png', audio: '/assets/pitch/voice/slide_10.mp3' },
            { image: '/images/slide-11.png', audio: '/assets/pitch/voice/slide_11.mp3' },
            { image: '/images/slide-12.png', audio: '/assets/pitch/voice/slide_12.mp3' },
            { image: '/images/slide-13.png', audio: '/assets/pitch/voice/slide_13.mp3' },
            { image: '/images/slide-14.png', audio: '/assets/pitch/voice/slide_14.mp3' }
        ];
        
        let currentSlide = 0;
        let audio = null;
        let isPlaying = false;
        const speeds = [1, 1.25, 1.5, 1.75, 2];
        let currentSpeedIndex = 0;
        let slidesLoaded = 0;
        let firstAudioReady = false;
        let isInitialized = false;
        let touchStartX = 0;
        let touchEndX = 0;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // Preload all slide images
        function preloadSlides() {
            console.log('Preloading slides...');
            const slideViewer = document.getElementById('slide-viewer');
            const loadPromises = [];
            
            // Set timeout for image loading
            const imageLoadTimeout = setTimeout(() => {
                console.warn('Image loading timeout - showing what we have');
                if (slidesLoaded === 0) {
                    // If no images loaded, try to show first slide anyway
                    slidesLoaded = slides.length;
                    showSlide(0);
                    checkReady();
                }
            }, isMobile ? 10000 : 20000); // 10s mobile, 20s desktop
            
            slides.forEach((slide, index) => {
                const img = new Image();
                img.src = slide.image;
                img.className = 'slide-image';
                img.id = `slide-${index}`;
                img.alt = `Slide ${index + 1}`;
                
                // Add loading attribute for better mobile performance
                img.loading = index === 0 ? 'eager' : 'lazy';
                
                const loadPromise = new Promise((resolve, reject) => {
                    const imgTimeout = setTimeout(() => {
                        console.warn(`Slide ${index + 1} load timeout`);
                        resolve(); // Continue even if timeout
                    }, isMobile ? 5000 : 10000);
                    
                    img.onload = () => {
                        clearTimeout(imgTimeout);
                        slidesLoaded++;
                        console.log(`Slide ${index + 1} loaded (${slidesLoaded}/${slides.length})`);
                        resolve();
                    };
                    img.onerror = () => {
                        clearTimeout(imgTimeout);
                        console.error(`Failed to load slide ${index + 1}`);
                        resolve(); // Continue even if one fails
                    };
                });
                
                loadPromises.push(loadPromise);
                slideViewer.appendChild(img);
            });
            
            // Show first slide when all are loaded
            Promise.all(loadPromises).then(() => {
                clearTimeout(imageLoadTimeout);
                console.log('All slides loaded!');
                showSlide(0);
                checkReady();
            }).catch(err => {
                clearTimeout(imageLoadTimeout);
                console.error('Error loading slides:', err);
                // Show first slide anyway
                if (slidesLoaded > 0) {
                    showSlide(0);
                    checkReady();
                }
            });
            
            // On mobile, show first slide as soon as it loads (don't wait for all)
            if (isMobile) {
                const firstImg = slideViewer.querySelector('#slide-0');
                if (firstImg) {
                    firstImg.addEventListener('load', () => {
                        if (!isInitialized && slidesLoaded >= 1) {
                            console.log('First slide loaded on mobile - showing immediately');
                            showSlide(0);
                            const loadingOverlay = document.getElementById('loading-overlay');
                            if (loadingOverlay) {
                                loadingOverlay.classList.add('hidden');
                            }
                            isInitialized = true;
                        }
                    }, { once: true });
                }
            }
        }
        
        // Preload first audio file
        function preloadFirstAudio() {
            console.log('Preloading first audio...');
            const firstAudio = new Audio(slides[0].audio);
            firstAudio.preload = 'auto';
            
            // Set timeout for audio loading (mobile browsers can be slow)
            const audioTimeout = setTimeout(() => {
                console.warn('Audio loading timeout - continuing anyway');
                firstAudioReady = true;
                checkReady();
            }, isMobile ? 5000 : 10000); // 5s on mobile, 10s on desktop
            
            firstAudio.addEventListener('canplaythrough', () => {
                console.log('First audio ready');
                clearTimeout(audioTimeout);
                firstAudioReady = true;
                checkReady();
            }, { once: true });
            
            firstAudio.addEventListener('loadeddata', () => {
                // On mobile, loadeddata is more reliable than canplaythrough
                if (isMobile) {
                    console.log('First audio loaded (mobile)');
                    clearTimeout(audioTimeout);
                    firstAudioReady = true;
                    checkReady();
                }
            }, { once: true });
            
            firstAudio.addEventListener('error', (e) => {
                console.error('First audio failed to load:', e);
                clearTimeout(audioTimeout);
                firstAudioReady = true; // Continue anyway
                checkReady();
            });
        }
        
        // Check if everything is ready
        function checkReady() {
            // On mobile, show slides as soon as they're loaded, don't wait for audio
            if (isMobile && slidesLoaded === slides.length && !isInitialized) {
                console.log('Slides loaded on mobile - showing presentation');
                isInitialized = true;
                
                // Hide loading overlay
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                }
                
                // Show first slide immediately
                showSlide(0);
                
                // Don't show play prompt on mobile - let user use the control bar
                // Audio will load when user clicks play
                return;
            }
            
            // Desktop: wait for both slides and audio
            if (slidesLoaded === slides.length && firstAudioReady && !isInitialized) {
                console.log('Everything loaded, starting presentation...');
                isInitialized = true;
                
                // Hide loading overlay
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                }
                
                // Auto-play first slide audio after a short delay
                setTimeout(() => {
                    loadAudioForSlide(0, true);
                }, 500);
            }
        }
        
        // Fallback timeout - hide loading overlay after max wait time
        let loadingTimeout = null;
        function setupLoadingTimeout() {
            const maxWaitTime = isMobile ? 5000 : 15000; // 5s mobile (faster), 15s desktop
            loadingTimeout = setTimeout(() => {
                console.warn('Loading timeout reached - showing presentation anyway');
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay && !isInitialized) {
                    // Force initialization
                    isInitialized = true;
                    firstAudioReady = true;
                    
                    // Show first slide if we have at least one loaded
                    if (slidesLoaded === 0) {
                        // Try to show first slide even if not fully loaded
                        const firstSlide = document.getElementById('slide-0');
                        if (firstSlide) {
                            showSlide(0);
                            slidesLoaded = 1; // At least one slide is visible
                        } else {
                            // Create placeholder if nothing loaded
                            slidesLoaded = slides.length;
                            showSlide(0);
                        }
                    } else {
                        showSlide(0);
                    }
                    
                    loadingOverlay.classList.add('hidden');
                    
                    // On mobile, just show the slide - user can click play
                    // On desktop, try to auto-play
                    if (!isMobile) {
                        setTimeout(() => {
                            loadAudioForSlide(0, true);
                        }, 500);
                    }
                }
            }, maxWaitTime);
        }
        
        // Show specific slide
        function showSlide(slideIndex) {
            // Hide all slides
            document.querySelectorAll('.slide-image').forEach((img, index) => {
                if (index === slideIndex) {
                    img.classList.add('active');
                } else {
                    img.classList.remove('active');
                }
            });
        }
        
        // Stop current audio completely
        function stopAudio() {
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                audio.removeEventListener('loadedmetadata', updateAudioProgress);
                audio.removeEventListener('timeupdate', updateAudioProgress);
                audio.removeEventListener('ended', handleAudioEnded);
                audio.removeEventListener('error', handleAudioError);
                audio = null;
            }
            isPlaying = false;
            updateAudioButton();
            updateAudioProgress();
        }
        
        // Load audio for current slide
        function loadAudioForSlide(slideIndex, autoPlay = false) {
            console.log('Loading audio for slide', slideIndex + 1, 'autoPlay:', autoPlay);
            
            // Stop any existing audio FIRST
            stopAudio();
            
            // Create new audio instance
            const audioSrc = slides[slideIndex].audio;
            audio = new Audio(audioSrc);
            audio.playbackRate = speeds[currentSpeedIndex];
            
            // Add event listeners
            audio.addEventListener('loadedmetadata', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('timeupdate', () => {
                updateAudioProgress();
            });
            
            audio.addEventListener('ended', handleAudioEnded);
            audio.addEventListener('error', handleAudioError);
            
            // Auto-play if requested
            if (autoPlay) {
                // On mobile, audio autoplay is usually blocked
                // We'll handle this with user interaction
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio started playing for slide', slideIndex + 1);
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.log('Auto-play prevented (likely mobile browser):', err);
                            // Don't retry automatically on mobile - wait for user interaction
                            if (!isMobile) {
                                setTimeout(() => {
                                    if (audio) {
                                        audio.play().then(() => {
                                            isPlaying = true;
                                            updateAudioButton();
                                        }).catch(e => {
                                            console.log('Second auto-play attempt failed:', e);
                                        });
                                    }
                                }, 1000);
                            }
                        });
                }
            }
        }
        
        // Handle audio ended event
        function handleAudioEnded() {
            console.log('Audio ended for slide', currentSlide + 1);
            isPlaying = false;
            updateAudioButton();
            // Auto-advance to next slide
            if (currentSlide < slides.length - 1) {
                setTimeout(() => {
                    nextSlide();
                }, 500);
            }
        }
        
        // Handle audio error
        function handleAudioError(e) {
            console.error('Audio error for slide', currentSlide + 1, ':', e);
            isPlaying = false;
            updateAudioButton();
        }
        
        // Navigate to next slide
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                currentSlide++;
                showSlide(currentSlide);
                updateSlideCounter();
                updateButtons();
                loadAudioForSlide(currentSlide, wasPlaying);
            }
        }
        
        // Navigate to previous slide
        function prevSlide() {
            if (currentSlide > 0) {
                const wasPlaying = isPlaying && audio && !audio.paused;
                currentSlide--;
                showSlide(currentSlide);
                updateSlideCounter();
                updateButtons();
                loadAudioForSlide(currentSlide, wasPlaying);
            }
        }
        
        // Update slide counter
        function updateSlideCounter() {
            document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
        }
        
        // Update button states
        function updateButtons() {
            document.getElementById('prev-btn').disabled = currentSlide === 0;
            document.getElementById('next-btn').disabled = currentSlide === slides.length - 1;
        }
        
        // Update audio progress
        function updateAudioProgress() {
            if (audio && audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('audio-progress').style.width = progress + '%';
            } else {
                document.getElementById('audio-progress').style.width = '0%';
            }
        }
        
        // Seek audio when clicking on progress bar
        function setupProgressBarSeek() {
            const progressBar = document.querySelector('.audio-progress');
            if (progressBar) {
                progressBar.addEventListener('click', (e) => {
                    if (!audio || !audio.duration) return;
                    
                    const rect = progressBar.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percentage = clickX / rect.width;
                    const newTime = percentage * audio.duration;
                    
                    audio.currentTime = Math.max(0, Math.min(newTime, audio.duration));
                    updateAudioProgress();
                });
            }
        }
        
        // Toggle audio play/pause
        function toggleAudio() {
            if (!audio) {
                loadAudioForSlide(currentSlide, true);
                return;
            }
            
            if (isPlaying && !audio.paused) {
                audio.pause();
                isPlaying = false;
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            isPlaying = true;
                            updateAudioButton();
                        })
                        .catch(err => {
                            console.error('Play error:', err);
                            isPlaying = false;
                            updateAudioButton();
                        });
                }
            }
            updateAudioButton();
        }
        
        // Update audio button icon
        function updateAudioButton() {
            const btn = document.getElementById('audio-toggle');
            if (isPlaying) {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';
            } else {
                btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>';
            }
        }
        
        // Change playback speed
        function changeSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            const newSpeed = speeds[currentSpeedIndex];
            
            if (audio) {
                audio.playbackRate = newSpeed;
            }
            
            const speedBtn = document.getElementById('audio-speed');
            speedBtn.textContent = `${newSpeed}×`;
            speedBtn.classList.toggle('active', newSpeed > 1);
        }
        
        // Show mobile play prompt
        function showMobilePlayPrompt() {
            const prompt = document.createElement('div');
            prompt.id = 'mobile-play-prompt';
            prompt.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(20px);
                padding: 2rem;
                border-radius: 1.5rem;
                border: 2px solid rgba(255, 215, 0, 0.5);
                text-align: center;
                z-index: 1000;
                max-width: 90%;
            `;
            prompt.innerHTML = `
                <h3 style="color: white; margin-bottom: 1rem; font-size: 1.25rem;">Ready to Start</h3>
                <p style="color: rgba(255, 255, 255, 0.8); margin-bottom: 1.5rem;">Tap the play button to begin the presentation</p>
                <button id="start-presentation-btn" style="
                    background: rgba(255, 215, 0, 0.2);
                    border: 2px solid rgba(255, 215, 0, 0.6);
                    color: #FFD700;
                    padding: 1rem 2rem;
                    border-radius: 0.75rem;
                    font-size: 1rem;
                    font-weight: 600;
                    cursor: pointer;
                    min-height: 48px;
                    touch-action: manipulation;
                ">▶ Start Presentation</button>
            `;
            document.body.appendChild(prompt);
            
            document.getElementById('start-presentation-btn').addEventListener('click', () => {
                prompt.remove();
                loadAudioForSlide(0, true);
            });
        }
        
        // Touch swipe navigation
        function setupTouchNavigation() {
            const slideViewer = document.getElementById('slide-viewer');
            
            slideViewer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            slideViewer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left - next slide
                    nextSlide();
                } else {
                    // Swipe right - previous slide
                    prevSlide();
                }
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                toggleAudio();
            }
        });
        
        // Event listeners
        document.getElementById('next-btn').addEventListener('click', nextSlide);
        document.getElementById('prev-btn').addEventListener('click', prevSlide);
        document.getElementById('audio-toggle').addEventListener('click', toggleAudio);
        document.getElementById('audio-speed').addEventListener('click', changeSpeed);
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
        function initialize() {
            console.log('Initializing pitch deck page...');
            console.log('Mobile device detected:', isMobile);
            setupProgressBarSeek();
            setupTouchNavigation();
            updateSlideCounter();
            updateButtons();
            
            // Set up loading timeout fallback
            setupLoadingTimeout();
            
            // Preload everything before starting
            preloadSlides();
            preloadFirstAudio();
            
            // On mobile, also try to show first slide immediately if it's cached
            if (isMobile) {
                setTimeout(() => {
                    // Check if first slide is already loaded
                    const firstSlide = document.getElementById('slide-0');
                    if (firstSlide && firstSlide.complete && firstSlide.naturalHeight > 0) {
                        console.log('First slide already available');
                        if (!isInitialized) {
                            showSlide(0);
                            // Don't wait for all slides on mobile - show first one quickly
                            if (slidesLoaded >= 1) {
                                firstAudioReady = true;
                                checkReady();
                            }
                        }
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
