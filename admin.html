<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Submissions - Admin | Daena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <style>
        body {
            background: #02030a;
            color: white;
        }
        .submission-card {
            background: rgba(5, 8, 20, 0.85);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .submission-card:hover {
            border-color: rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <nav class="px-4 py-4 sticky top-0 z-50 bg-black/80 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-yellow-400">Daena Admin</a>
            <a href="/" class="text-white hover:text-yellow-400 transition">← Back to Site</a>
        </div>
    </nav>
    
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-4xl font-bold mb-4 text-yellow-400">Contact Form Submissions</h1>
            <p class="text-gray-400">View and manage all contact form submissions</p>
            <div class="mt-4 flex gap-4">
                <button onclick="refreshSubmissions()" class="px-4 py-2 bg-yellow-400/20 border border-yellow-400/50 rounded-lg hover:bg-yellow-400/30 transition">
                    Refresh
                </button>
                <button onclick="exportSubmissions()" class="px-4 py-2 bg-blue-500/20 border border-blue-500/50 rounded-lg hover:bg-blue-500/30 transition">
                    Export CSV
                </button>
                <button onclick="clearSubmissions()" class="px-4 py-2 bg-red-500/20 border border-red-500/50 rounded-lg hover:bg-red-500/30 transition">
                    Clear All
                </button>
            </div>
        </div>
        
        <div id="submissions-container" class="space-y-4">
            <!-- Submissions will be loaded here -->
        </div>
        
        <div id="empty-state" class="text-center py-12 text-gray-500 hidden">
            <p class="text-xl">No submissions yet.</p>
            <p class="text-sm mt-2">Contact form submissions will appear here.</p>
        </div>
    </div>
    
    <script>
        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('contact_submissions') || '[]');
            const container = document.getElementById('submissions-container');
            const emptyState = document.getElementById('empty-state');
            
            if (submissions.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            // Sort by timestamp (newest first)
            submissions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            container.innerHTML = submissions.map(sub => `
                <div class="submission-card">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-yellow-400">${sub.firstName} ${sub.lastName}</h3>
                            <p class="text-sm text-gray-400">${new Date(sub.timestamp).toLocaleString()}</p>
                        </div>
                        <button onclick="deleteSubmission('${sub.id}')" class="text-red-400 hover:text-red-300 text-sm">
                            Delete
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div>
                            <span class="text-gray-400">Email:</span>
                            <a href="mailto:${sub.email}" class="text-yellow-400 hover:underline ml-2">${sub.email}</a>
                        </div>
                        ${sub.phone ? `
                        <div>
                            <span class="text-gray-400">Phone:</span>
                            <a href="tel:${sub.phone}" class="text-yellow-400 hover:underline ml-2">${sub.phone}</a>
                        </div>
                        ` : ''}
                    </div>
                    <div class="mt-4 pt-4 border-t border-white/10">
                        <span class="text-gray-400 text-sm">Message:</span>
                        <p class="text-white mt-2">${sub.message}</p>
                    </div>
                </div>
            `).join('');
        }
        
        function deleteSubmission(id) {
            if (!confirm('Are you sure you want to delete this submission?')) return;
            
            const submissions = JSON.parse(localStorage.getItem('contact_submissions') || '[]');
            const filtered = submissions.filter(s => s.id !== id);
            localStorage.setItem('contact_submissions', JSON.stringify(filtered));
            loadSubmissions();
        }
        
        function refreshSubmissions() {
            loadSubmissions();
        }
        
        function exportSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('contact_submissions') || '[]');
            if (submissions.length === 0) {
                alert('No submissions to export');
                return;
            }
            
            // Convert to CSV
            const headers = ['Timestamp', 'First Name', 'Last Name', 'Email', 'Phone', 'Message'];
            const rows = submissions.map(s => [
                s.timestamp,
                s.firstName,
                s.lastName,
                s.email,
                s.phone || '',
                `"${s.message.replace(/"/g, '""')}"`
            ]);
            
            const csv = [
                headers.join(','),
                ...rows.map(r => r.join(','))
            ].join('\n');
            
            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `contact-submissions-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
        
        function clearSubmissions() {
            if (!confirm('Are you sure you want to delete ALL submissions? This cannot be undone.')) return;
            localStorage.removeItem('contact_submissions');
            loadSubmissions();
        }
        
        // Load on page load
        loadSubmissions();
        
        // Auto-refresh every 30 seconds
        setInterval(loadSubmissions, 30000);
    </script>
</body>
</html>
